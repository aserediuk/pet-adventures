    let s = land ? Math.min(ah / H, (aw - 2 * side) / W) : Math.min(aw / W, ah * 0.58 / H);
    const whole = Math.floor(s + 0.25);                            // snap up to whole pixels if it still fits (iPad)
    if (whole >= 2 && whole * H <= ah && whole * W <= (land ? aw - 1.4 * side : aw)) s = whole;
    s = Math.max(0.5, s);

function toggleFullscreen() {
  try {
    const el = document.documentElement;

      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});

    } else {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  } catch (e) { /* fullscreen not available - ignore */ }
  setTimeout(fitCanvas, 120);
}

const FW = 6, FH = 8, LINE_H = 10;
const fontIndex = {};
let fontAtlas = null;
const tintCache = {};
function buildFont() {
  const chars = Object.keys(FONT);
  fontAtlas = makeCanvas(chars.length * FW, FH);
  const g = fontAtlas.getContext('2d');
  g.fillStyle = '#fff';
  chars.forEach((ch, i) => {
    fontIndex[ch] = i;
    FONT[ch].split(' ').forEach((row, y) => {
      for (let x = 0; x < row.length; x++) if (row[x] === '#') g.fillRect(i * FW + x, y, 1, 1);
    });
  });
}
function tinted(color) {
  let c = tintCache[color];
  if (!c) {
    c = makeCanvas(fontAtlas.width, fontAtlas.height);
    const g = c.getContext('2d');
    g.drawImage(fontAtlas, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, c.width, c.height);
    tintCache[color] = c;
  }
  return c;
}
function textW(str, s = 1) { str = String(str); return str.length ? (str.length * FW - 1) * s : 0; }
function drawText(str, x, y, color = COL.ink, s = 1, shadow = null) {
  str = String(str);
  if (shadow) { const o = Math.min(s, 2); drawText(str, x + o, y + o, shadow, s, null); }
  const img = tinted(color);
  x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === ' ') continue;
    let idx = fontIndex[ch];
    if (idx === undefined) idx = fontIndex['?'];
    ctx.drawImage(img, idx * FW, 0, 5, FH, x + i * FW * s, y, 5 * s, FH * s);
  }
}
function drawTextC(str, cx, y, color, s = 1, shadow = null) { drawText(str, Math.round(cx - textW(str, s) / 2), y, color, s, shadow); }
function drawTextR(str, rx, y, color, s = 1) { drawText(str, rx - textW(str, s), y, color, s); }
// Word-wrap by exact pixel width of the pixel font.
function wrapText(text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word0 of para.split(' ')) {
      let word = word0;
      const t = line ? line + ' ' + word : word;
      if (textW(t) <= maxW) { line = t; continue; }
      if (line) out.push(line);
      const n = Math.max(1, Math.floor((maxW + 1) / FW));
      while (textW(word) > maxW) { out.push(word.slice(0, n)); word = word.slice(n); }
      line = word;
    }
    out.push(line);
  }
  return out;
}

// 3. SPRITES (string arrays + palettes, rendered once to canvases)
// ---------------------------------------------------------------------
const SPRITE_DEFS = [];   // kept for the self-test
function buildSprite(name, rows, pal, opts = {}) {
  let grid = rows.map(r => r.split(''));
  if (opts.mirror) grid = grid.map(r => r.concat(r.slice().reverse()));
  const w = grid.length ? grid[0].length : 0;
  if (opts.h && grid.length < opts.h) {
    const pad = [];
    for (let i = grid.length; i < opts.h; i++) pad.push(new Array(w).fill('.'));
    grid = pad.concat(grid);
  }
  if (opts.overlay) {
    for (const ov of opts.overlay) {
      ov.rows.forEach((r, yy) => {
        for (let xx = 0; xx < r.length; xx++) {
          const ch = r[xx], gy = ov.y + yy, gx = ov.x + xx;
          if (ch !== '.' && grid[gy] && gx >= 0 && gx < w) grid[gy][gx] = ch;
        }
      });
    }
  }
  SPRITE_DEFS.push({ name, rows, pal, opts, w, h: grid.length });
  const c = makeCanvas(w, grid.length);
  const g = c.getContext('2d');
  grid.forEach((r, y) => r.forEach((ch, x) => {
    if (ch === '.' || ch === ' ') return;
    const col = pal[ch];
    if (!col) return;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }));
  return c;
}
function flipCanvas(src) {
  const c = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c;
}
const silCache = new Map();
function silhouette(src, color) {
  const key = color;
  if (!silCache.has(src)) silCache.set(src, {});
  const bucket = silCache.get(src);
  if (bucket[key]) return bucket[key];
  const c = bucket[key] = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height); return c;
}

function paintPet(base, detail) {

  const put = (x, y, c) => { if (x >= 0 && x < 32 && y >= 0 && y < 32) g[y][x] = c; };
  const sign = (ax, ay, bx, by, cx, cy) => (ax - cx) * (by - cy) - (bx - cx) * (ay - cy);
  const run = ops => {
    for (const op of ops) {
      const k = op[0];
      if (k === 'E') {
        const [, cx, cy, rx, ry, c] = op;
        for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
          const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
          if (dx * dx + dy * dy <= 1) put(x, y, c);
        }
      } else if (k === 'R') {
        const [, x, y, w, h, c] = op;
        for (let j = 0; j < Math.max(1, Math.round(h)); j++) for (let i = 0; i < Math.max(1, Math.round(w)); i++) put(Math.round(x) + i, Math.round(y) + j, c);
      } else if (k === 'P') put(Math.round(op[1]), Math.round(op[2]), op[3]);
      else if (k === 'T') {
        const [, ax, ay, bx, by, cx, cy, c] = op;
        for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
          const px = x + 0.5, py = y + 0.5;
          const d1 = sign(px, py, ax, ay, bx, by), d2 = sign(px, py, bx, by, cx, cy), d3 = sign(px, py, cx, cy, ax, ay);
          if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) put(x, y, c);
        }
      }
    }
  };
  run(base);
  const o = g.map(r => r.slice());
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    if (g[y][x] !== '.') continue;
    if ((x > 0 && g[y][x - 1] !== '.') || (x < 31 && g[y][x + 1] !== '.') || (y > 0 && g[y - 1][x] !== '.') || (y < 31 && g[y + 1][x] !== '.')) o[y][x] = 'o';

function treatChance(p, key) { return likesTreat(p, key) ? Math.min(0.95, catchChance(p) * 1.2) : catchChance(p) * 0.3; }
const WRONG_TREAT_REFUSE = 0.75;
function enemyChooseMove(e, target) {
  if (Math.random() < 0.5) return pick(e.moves);
  let best = e.moves[0], bv = -1;
  for (const m of e.moves) {
    const v = MOVES[m].power * typeMult(MOVES[m].type, petType(target));
    if (v > bv) { bv = v; best = m; }
  }
  return best;
}
function healPet(p) { p.hp = maxHp(p); }
function isTired(p) { return p.hp <= 0; }

function tileAt(map, x, y) {
  if (y < 0 || y >= map.rows.length || x < 0 || x >= map.rows[0].length) return 'T';
  return map.rows[y][x];
}
function exitAt(map, x, y) {
  return map.exits.find(e => x >= e.x && x < e.x + e.w && y >= e.y && y < e.y + e.h) || null;
}
function doorAt(map, x, y) { return map.doors.find(d => d.x === x && d.y === y) || null; }
// NPCs with moveTo step aside once they've been beaten.
function npcPos(n) {
  if (n.moveTo && G && G.flags && G.flags[n.id]) return n.moveTo;
  return n;
}
function npcAt(map, x, y) { return map.npcs.find(n => { const q = npcPos(n); return q.x === x && q.y === y; }) || null; }
function chestAt(map, x, y) { return map.chests.find(c => c.x === x && c.y === y) || null; }
function isWalkable(map, x, y) {
  const info = TILE_INFO[tileAt(map, x, y)];
  if (!info || !info.walk) return false;
  if (npcAt(map, x, y) || chestAt(map, x, y) || questObjAt(map, x, y)) return false;
  return true;
}
function nearWater(map, x, y) {
  if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (tileAt(map, x + dx, y + dy) === '~') return true;
  return false;
}
function wildTable(map, x, y) {
  const ch = Number.isFinite(x) ? tileAt(map, x, y) : null;
  if (map.byTile && map.byTile[ch]) return map.byTile[ch];   // e.g. piglets live in the mud
  if (map.pond && nearWater(map, x, y)) return map.pond;     // water pets live in the reeds
  return map.wild;
}
function rollWild(map, x, y) {
  const tab = wildTable(map, x, y); if (!tab) return null;
  let total = 0; for (const e of tab) total += e.w;
  let r = Math.random() * total;
  for (const e of tab) { r -= e.w; if (r <= 0) return createPet(e.sp, rint(e.min, e.max)); }
  const e = tab[tab.length - 1]; return createPet(e.sp, rint(e.min, e.max));
}

const stack = [];

class MessageScreen {
  constructor(text, resolve, name, auto) {
    this.name = name || null;
    this.auto = auto || 0; this.hold = 0;
    const lines = wrapText(text, DLG.w - 30);
    this.pages = [];
    for (let i = 0; i < lines.length; i += 3) this.pages.push(lines.slice(i, i + 3));
    this.page = 0; this.shown = 0; this.resolve = resolve;
  }
  pageLen() { return this.pages[this.page].join('').length; }
  update(inp) {
    const speed = held.ok ? 5 : 1.5;
    if (this.shown < this.pageLen()) { this.shown = Math.min(this.pageLen(), this.shown + speed); this.hold = 0; if (frame % 4 === 0) sfx('blip'); }
    else if (this.auto && ++this.hold >= this.auto) inp = inp.concat(['ok']);
    for (const a of inp) {
      if (a !== 'ok' && a !== 'back') continue;
      if (this.shown < this.pageLen()) { this.shown = this.pageLen(); continue; }
      sfx('move');
      if (this.page < this.pages.length - 1) { this.page++; this.shown = 0; this.hold = 0; }
      else { pop(this); this.resolve(); return; }
    }
  }
  draw() {
    box(DLG.x, DLG.y, DLG.w, DLG.h);
    if (this.name) {
      const w = textW(this.name) + 10;
      box(DLG.x + 6, DLG.y - 12, w, 14, COL.sel);
      drawText(this.name, DLG.x + 11, DLG.y - 8, COL.ink);
    }
    let left = Math.floor(this.shown);
    this.pages[this.page].forEach((ln, i) => {
      const part = ln.slice(0, Math.max(0, left)); left -= ln.length;
      drawText(part, DLG.x + 10, DLG.y + 9 + i * 12, COL.ink);
    });
    if (this.shown >= this.pageLen() && Math.floor(frame / 20) % 2 === 0) drawText('▼', DLG.x + DLG.w - 14, DLG.y + DLG.h - 14, COL.accent);
  }
  hint() { return 'Enter/Space/E: next (hold = faster)   V: emote   ' + soundHint(); }
  tap() { inputQueue.push('ok'); }
}
function fillName(text) { return String(text).replace(/\{name\}/g, G && G.name ? G.name : 'friend'); }
function say(text, name) { return new Promise(r => push(new MessageScreen(fillName(text), r, name))); }

// options: array of strings or {label, disabled}. Returns index, or cancelValue on back (if allowed).
class ChoiceScreen {
  constructor(options, resolve, o = {}) {
    this.opts = options.map(x => typeof x === 'string' ? { label: x } : x);
    this.resolve = resolve; this.o = o;
    this.i = clamp(o.start || 0, 0, this.opts.length - 1);
    const maxLabel = Math.max(...this.opts.map(x => textW(x.label + (x.right ? '   ' + x.right : ''))));
    this.w = Math.max(o.minW || 0, maxLabel + 26);
    this.rowH = 12;
    this.h = this.opts.length * this.rowH + 12;
    this.x = o.x !== undefined ? o.x : DLG.x + DLG.w - this.w;
    this.y = o.y !== undefined ? o.y : DLG.y - this.h - 2;
    this.promptLines = o.prompt ? wrapText(o.prompt, DLG.w - 20).slice(0, 3) : null;
  }
  update(inp) {
    for (const a of inp) {
      if (a === 'up') { this.i = (this.i + this.opts.length - 1) % this.opts.length; sfx('move'); }
      else if (a === 'down') { this.i = (this.i + 1) % this.opts.length; sfx('move'); }
      else if (a === 'ok') {
        if (this.opts[this.i].disabled) { sfx('bump'); continue; }
        sfx('confirm'); pop(this); this.resolve(this.i); return;
      } else if (a === 'back' && this.o.cancel !== undefined) { sfx('cancel'); pop(this); this.resolve(this.o.cancel); return; }
    }
  }
  draw() {
    if (this.promptLines) {

    }

      box(this.x, this.y - 14, this.w, 16, COL.sel);
      drawText(this.o.title, this.x + 8, this.y - 10, COL.ink);
    }
    box(this.x, this.y, this.w, this.h);
    this.opts.forEach((op, k) => {
      const yy = this.y + 7 + k * this.rowH;
      if (k === this.i) { ctx.fillStyle = COL.sel; ctx.fillRect(this.x + 3, yy - 2, this.w - 6, 11); drawCursor(this.x + 6, yy); }
      if (op.label[0] === '\u2665') { drawText('\u2665', this.x + 16, yy, COL.red); drawText(op.label.slice(1), this.x + 22, yy, op.disabled ? COL.dim : COL.ink); }
      else drawText(op.label, this.x + 16, yy, op.disabled ? COL.dim : COL.ink);
      if (op.right) drawTextR(op.right, this.x + this.w - 8, yy, op.disabled ? COL.dim : COL.ink);

    if (this.o.info) {
      const t = this.o.info(this.i);

  }
  hint() { return 'Up/Down: choose   Enter: OK' + (this.o.cancel !== undefined ? '   ' + hintKeys() + ': back' : '') + '   ' + soundHint(); }
}
ChoiceScreen.prototype.tap = function (x, y) {
  if (x >= this.x && x < this.x + this.w && y >= this.y + 4 && y < this.y + this.h - 4) {
    const k = clamp(Math.floor((y - this.y - 5) / this.rowH), 0, this.opts.length - 1);
    if (this.opts[k].disabled) { sfx('bump'); return; }

  }

  const p = playerPixel();

  tx = mw <= W ? (mw - W) / 2 : clamp(tx, 0, mw - W);

function onStep() {
  G.stats.steps++;

  const ex = exitAt(m, G.x, G.y);
  if (ex) {
    runScript(async () => {
      await fadeTo(1, 10);
      const target = MAPS[ex.to];
      const off = clamp(G.x - ex.x, 0, ex.w - 1);
      let tx = ex.tx + off, ty = ex.ty;

function drawWorld() {
  const m = world.map;

  ctx.fillStyle = m.bg || (m.lab ? '#14121e' : '#1e5a2a'); ctx.fillRect(0, 0, W, H);

    for (let tx = x0; tx <= x0 + Math.ceil(W / TS); tx++) {
      if (ty < 0 || tx < 0 || ty >= m.rows.length || tx >= m.rows[0].length) continue;
      const ch = m.rows[ty][tx];
      if (ch === 'C') { drawCage(tx, ty, tx * TS - cx, ty * TS - cy); continue; }
      const frames = TILES[ch] || TILES['.'];

    }
  }

  const things = [];

    let oy = 0;
    if (world.chestAnim && world.chestAnim.id === c.id) oy = world.chestAnim.t < 10 ? -Math.round(Math.sin(world.chestAnim.t / 10 * Math.PI) * 3) : 0;

        ctx.fillRect(Math.round(c.x * TS - cx + 8 + Math.cos(ang) * r), Math.round(c.y * TS - cy + 4 - t * 0.2 + Math.sin(ang) * r * 0.5), 2, 2);
      }
    }
  } });
  for (const n of m.npcs) { const q = npcPos(n); things.push({ y: q.y, draw: () => {
    const d = world.npcDir[n.id] || q.dir;
    ctx.drawImage(PEOPLE[n.look][d][0], q.x * TS - cx, q.y * TS - cy - 2);
    if (n.trainer && !G.flags[n.id] && Math.floor(frame / 30) % 2 === 0) drawText('!', q.x * TS - cx + 6, q.y * TS - cy - 12, COL.red);
    const task = QUEST_BY_GIVER[n.id];
    if (task && (questState(task) === 'new' || questReady(task))) drawText(questReady(task) ? '!' : '?', q.x * TS - cx + 6, q.y * TS - cy - 12 - (Math.floor(frame / 20) % 2), questReady(task) ? '#3cc85a' : '#ffd84a', 1, COL.border);
  } }); }
  for (const q of QUESTS) if (q.kind !== 'show' && MAPS[q.map] === m && questState(q) === 'active') things.push({ y: q.y, draw: () => {
    const X = q.x * TS - cx, Y = q.y * TS - cy, bob = Math.floor(frame / 15) % 2;
    if (q.kind === 'pet') { ctx.drawImage(PET_SPR[q.pet], 0, 0, 32, 32, X, Y - 2 + bob, 16, 16); drawText('?', X + 6, Y - 12, '#ffd84a', 1, COL.border); }
    else { ctx.drawImage(EMOTE_SPR.star, X + 4, Y + 4 + bob); if (frame % 40 < 20) { ctx.fillStyle = '#fff'; ctx.fillRect(X + 2, Y + 3, 2, 2); ctx.fillRect(X + 12, Y + 10, 2, 2); } }
  } });
  const pp = playerPixel();
  const pf = world.moving && world.mt < 0.55 ? 1 : 0;
  things.push({ y: pp.y / TS + 0.01, draw: () => {
    const hop = emoteHop(world.emote);
    ctx.drawImage(PEOPLE.player[world.emote ? 'down' : G.dir][pf], Math.round(pp.x) - cx, Math.round(pp.y) - cy - 2 + hop);
    drawEmote(world.emote, Math.round(pp.x) - cx + 8, Math.round(pp.y) - cy - 2 + hop);
    if (!world.moving && TILE_INFO[tileAt(m, G.x, G.y)].grass) {
      ctx.drawImage(TILES[','][0], 0, 11, 16, 5, G.x * TS - cx, G.y * TS - cy + 11, 16, 5);
    }
  } });
  things.sort((a, b) => a.y - b.y).forEach(t => t.draw());
  for (const l of m.labels) {
    const w = textW(l.text) + 8, lx = Math.round(l.tx * TS - cx - w / 2), ly = Math.round(l.ty * TS - cy);

    drawText(l.text, lx + 4, ly + 2, COL.ink);
  }
  if (m.dark) { ctx.fillStyle = 'rgba(10,40,30,0.22)'; ctx.fillRect(0, 0, W, H); }
  if (world.banner > 0) {

async function bagMenu(inBattle, battle) {

    const i = await choose(bagOptions(battle).concat([{ label: '  Back' }]), {

      info: k => k >= n ? 'Close the bag.' : (wild && ITEMS[ITEM_ORDER[k]].treat

        : ITEMS[ITEM_ORDER[k]].desc),
    });
    if (i === n) return false;

      return { treat: key };
    }
    const t = await choosePet({ title: 'Use ' + ITEMS[key].name + ' on which pet?' });
    if (t < 0) continue;

async function useHealItem(key, p) {
  const max = maxHp(p);
  if (p.hp >= max) { await say(petName(p) + ' already has full HP!'); return false; }

// Pet Pen: two columns. Pick a pet on one side, then a spot on the other side to swap/move.
class PenScreen {
  constructor(resolve) { this.resolve = resolve; this.col = 0; this.row = 0; this.mark = null; this.scroll = 0; this.opaque = true; this.msg = ''; }
  rows(col) { return col === 0 ? PARTY_MAX : G.pen.length + 1; }
  update(inp) {
    for (const a of inp) {
      if (a === 'up') { this.row = (this.row - 1 + this.rows(this.col)) % this.rows(this.col); sfx('move'); }
      else if (a === 'down') { this.row = (this.row + 1) % this.rows(this.col); sfx('move'); }
      else if (a === 'left' || a === 'right') { this.col ^= 1; this.row = Math.min(this.row, this.rows(this.col) - 1); sfx('move'); }
      else if (a === 'ok') this.select();
      else if (a === 'back') {
        sfx('cancel');
        if (this.mark) { this.mark = null; continue; }
        pop(this); this.resolve(); return;
      }
    }
    const vis = 9;
    if (this.col === 1) { if (this.row < this.scroll) this.scroll = this.row; if (this.row >= this.scroll + vis) this.scroll = this.row - vis + 1; }
  }
  select() {
    const here = { col: this.col, row: this.row };
    if (!this.mark || this.mark.col === here.col) {
      const empty = here.col === 0 ? !G.party[here.row] : here.row === 0;
      if (empty && here.col === 0) { this.msg = 'Pick a pet in the Pen to bring it here.'; }
      if (empty && here.col === 1) { this.msg = 'Pick a pet in your party first.'; sfx('bump'); return; }
      this.mark = here; sfx('confirm');
      if (!empty) this.msg = 'Now pick a spot on the other side.';
      return;
    }
    const partyRow = here.col === 0 ? here.row : this.mark.row;
    const penRow = here.col === 1 ? here.row : this.mark.row;
    this.mark = null;
    this.doMove(partyRow, penRow);
  }
  doMove(partyRow, penRow) {
    const pp = G.party[partyRow];
    const penPet = penRow > 0 ? G.pen[penRow - 1] : null;
    if (pp && penPet) {
      healPet(pp); G.pen[penRow - 1] = pp; G.party[partyRow] = penPet;
      sfx('confirm'); this.msg = petName(penPet) + ' joined your party. ' + petName(pp) + ' is resting in the Pen.';
    } else if (pp && !penPet) {
      const rest = G.party.filter((p, k) => k !== partyRow);
      if (!rest.length || !rest.some(p => !isTired(p))) { sfx('bump'); this.msg = 'You need to keep at least one healthy pet with you!'; return; }
      healPet(pp); G.party.splice(partyRow, 1); G.pen.push(pp);

    } else if (!pp && penPet) {
      if (G.party.length >= PARTY_MAX) { sfx('bump'); this.msg = 'Your party is full.'; return; }
      G.pen.splice(penRow - 1, 1); G.party.push(penPet);
      sfx('confirm'); this.msg = petName(penPet) + ' joined your party!';

  }

class IntroScreen {
  constructor() { this.opaque = true; this.i = 0; this.done = false; this.begin(); }
  scene() { return INTRO[Math.min(this.i, INTRO.length - 1)]; }
  begin() { this.t = 0; const s = this.scene(); if (s.music) playMusic(s.music); else stopMusic(); }
  dur() { const s = this.scene(); return s.min || Math.max(330, Math.round(s.text.length / 1.5) + 200); }
  update(inp) {
    if (this.done) return;
    this.t++;
    const s = this.scene();
    if (s.sfxAt && s.sfxAt[this.t]) sfx(s.sfxAt[this.t]);
    if (s.sfxEvery && this.t % s.sfxEvery[0] === 0) sfx(s.sfxEvery[1]);
    if (s.text && this.t * 1.5 < s.text.length && this.t % 4 === 0) sfx('blip');
    if (inp.includes('space') || inp.includes('back')) { this.finish(); return; }
    if (inp.includes('ok')) {
      if (s.text && this.t * 1.5 < s.text.length) this.t = Math.ceil(s.text.length / 1.5);
      else this.next();
      return;
    }
    if (this.t >= this.dur()) this.next();
  }
  next() { this.i++; if (this.i >= INTRO.length) this.finish(); else this.begin(); }
  finish() {
    if (this.done) return;
    this.done = true;
    runScript(async () => { await fadeTo(1, 14); pop(this); push(new TitleScreen()); playMusic('hero'); await fadeTo(0, 14); });
  }
  draw() {
    const s = this.scene();
    s.draw(this.t);
    if (s.text) {
      box(DLG.x, DLG.y, DLG.w, DLG.h);
      let left = Math.floor(this.t * 1.5);
      wrapText(s.text, DLG.w - 20).slice(0, 3).forEach((ln, k) => { drawText(ln.slice(0, Math.max(0, left)), DLG.x + 10, DLG.y + 9 + k * 12, COL.ink); left -= ln.length; });

  }

async function battleTurn(B) {
  const act = await chooseAction(B);
  if (act.kind === 'run') {
    sfx('run');
    if (B.wild) await bsay('You got away safely!');
    else await bsay('You left the battle. ' + B.o.trainer.name + ' says: "Come back and try again any time!"');
    return 'run';
  }
  if (act.kind === 'switch') {
    sfx('switch');
    await bsay('Come back, ' + petName(B.player) + '!');
    B.showPlayer = false; await wait(10);
    B.setPlayer(act.pet);
    await bsay('Go, ' + petName(act.pet) + '!');
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  if (act.kind === 'item') { B.dispP = B.player.hp; const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null; }
  if (act.kind === 'treat') {
    if (await throwTreat(B, act.key)) return 'caught';
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  // Fight: faster pet goes first (ties: player first).
  const playerFirst = petStats(B.player).spd >= petStats(B.enemy).spd;
  if (playerFirst) {
    await attack(B, true, act.move);
    if (isTired(B.enemy)) return onEnemyKO(B);
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  const r = await enemyTurn(B);
  if (r === 'lose') return 'lose';
  if (r === 'switched') return null;
  await attack(B, true, act.move);
  if (isTired(B.enemy)) return onEnemyKO(B);
  return null;
}

// ---------------------------------------------------------------------
// 18. MAIN LOOP
// ---------------------------------------------------------------------
const STEP_MS = 1000 / 60;
let lastT = 0, acc = 0;
function update() {
  frame++;
  if (touchUI) touchRepeat();
  for (let i = timers.length - 1; i >= 0; i--) {
    if (--timers[i].n <= 0) { const t = timers[i]; timers.splice(i, 1); t.r(); }
  }
  updateFade();
  tickEmotes();
  const inp = inputQueue; inputQueue = [];
  const t = topScreen();
  if (t && t.update) t.update(fade.a >= 1 && fade.target >= 1 ? [] : inp);
  if (G && stack.length && !(stack[0] instanceof TitleScreen)) G.stats.time += 1 / 60;
}
function drawHintBar() {
  let s = '';
  for (let i = stack.length - 1; i >= 0; i--) { const h = stack[i].hint ? stack[i].hint() : ''; if (h) { s = h; break; } }
  if (stack[stack.length - 1] === overworld && busy) s = soundHint();
  ctx.fillStyle = COL.bar; ctx.fillRect(0, HINT_Y, W, H - HINT_Y);
  drawText(touchUI ? touchHint(s) : s, 4, HINT_Y + 1, COL.barText);
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  let start = 0;
  for (let i = stack.length - 1; i >= 0; i--) if (stack[i].opaque) { start = i; break; }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let i = start; i < stack.length; i++) stack[i].draw();
  if (fade.a > 0) { ctx.globalAlpha = fade.a; ctx.fillStyle = fade.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHintBar();
}
function loop(now) {
  if (!lastT) lastT = now;
  acc += Math.min(250, now - lastT); lastT = now;
  let n = 0;
  while (acc >= STEP_MS) {
    try { update(); } catch (e) { console.error(e); recoverFromError(); }
    acc -= STEP_MS;
    if (++n > 5) { acc = 0; break; }
  }
  try { render(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

function runSelfTest() {
  const out = [];
  let fails = 0;
  const check = (name, ok, detail) => { out.push((ok ? 'PASS  ' : 'FAIL  ') + name + (ok ? '' : '  -> ' + detail)); if (!ok) fails++; };

  // Sprites
  const sErr = [];
  for (const d of SPRITE_DEFS) {
    const w0 = d.rows[0].length;
    d.rows.forEach((r, i) => {
      if (r.length !== w0) sErr.push(d.name + ' row ' + i + ' has ' + r.length + ' px, expected ' + w0);
      for (const ch of r) if (ch !== '.' && !d.pal[ch]) sErr.push(d.name + ' unknown colour "' + ch + '"');
    });

function songEventDump() {
  const out = { sting: activeTheme().sting.slice(), theme: activeTheme().theme.slice(), songs: {} };
  for (const name of logicalSongs()) {   // each song as the active theme plays it
    const song = compileSong(themeSong(name)), pl = { song, formIdx: 0, step: 0, done: false }, ev = [];
    const total = song.form.reduce((n, k) => n + song.parts[k].len, 0) * 2;
    for (let i = 0; i < total && !pl.done; i++) {
      const part = song.parts[song.form[pl.formIdx]];
      for (const layer of part.layers) {
        const e = layer.ev[(pl.step + (layer.off || 0)) % layer.ev.length];
        if (e) ev.push([i, layer.voice, e.drum || e.chirp || +e.f.toFixed(3), e.dur, e.acc ? 1 : 0,

    }

function boot() {
  loadSoundStyle();
  buildAllSprites();
  if (TEST_MODE) runSelfTest();
  else if (MUSIC_MODE) push(new MusicRoomScreen());
  else if (VIEW) devView(VIEW);
  else push(new SplashScreen());
  if (VIEW === 'smoke') {   // headless browsers barely run animation frames: step the game with a timer instead
    const tick = () => { try { update(); } catch (e) { console.error(e); } setTimeout(tick, 2); };
    tick();
    return;
  }
  requestAnimationFrame(loop);
}
boot();
</script>
