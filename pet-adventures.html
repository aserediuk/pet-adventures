let scale = 1;
function fitCanvas() {
  const vw = window.innerWidth || W, vh = window.innerHeight || H;
  scale = Math.max(1, Math.floor(Math.min(vw / W, vh / H)));
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fitCanvas);

function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen() {
  try {
    const el = document.documentElement;
    if (isFullscreen()) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  } catch (e) { /* fullscreen not available - ignore */ }
  setTimeout(fitCanvas, 120);
}

const FW = 6, FH = 8, LINE_H = 10;
const fontIndex = {};
let fontAtlas = null;
const tintCache = {};
function buildFont() {
  const chars = Object.keys(FONT);
  fontAtlas = makeCanvas(chars.length * FW, FH);
  const g = fontAtlas.getContext('2d');
  g.fillStyle = '#fff';
  chars.forEach((ch, i) => {
    fontIndex[ch] = i;
    FONT[ch].split(' ').forEach((row, y) => {
      for (let x = 0; x < row.length; x++) if (row[x] === '#') g.fillRect(i * FW + x, y, 1, 1);
    });
  });
}
function tinted(color) {
  let c = tintCache[color];
  if (!c) {
    c = makeCanvas(fontAtlas.width, fontAtlas.height);
    const g = c.getContext('2d');
    g.drawImage(fontAtlas, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, c.width, c.height);
    tintCache[color] = c;
  }
  return c;
}
function textW(str, s = 1) { str = String(str); return str.length ? (str.length * FW - 1) * s : 0; }
function drawText(str, x, y, color = COL.ink, s = 1, shadow = null) {
  str = String(str);
  if (shadow) { const o = Math.min(s, 2); drawText(str, x + o, y + o, shadow, s, null); }
  const img = tinted(color);
  x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === ' ') continue;
    let idx = fontIndex[ch];
    if (idx === undefined) idx = fontIndex['?'];
    ctx.drawImage(img, idx * FW, 0, 5, FH, x + i * FW * s, y, 5 * s, FH * s);
  }
}
function drawTextC(str, cx, y, color, s = 1, shadow = null) { drawText(str, Math.round(cx - textW(str, s) / 2), y, color, s, shadow); }
function drawTextR(str, rx, y, color, s = 1) { drawText(str, rx - textW(str, s), y, color, s); }
// Word-wrap by exact pixel width of the pixel font.
function wrapText(text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word0 of para.split(' ')) {
      let word = word0;
      const t = line ? line + ' ' + word : word;
      if (textW(t) <= maxW) { line = t; continue; }
      if (line) out.push(line);
      const n = Math.max(1, Math.floor((maxW + 1) / FW));
      while (textW(word) > maxW) { out.push(word.slice(0, n)); word = word.slice(n); }
      line = word;
    }
    out.push(line);
  }
  return out;
}

const SPRITE_DEFS = [];   // kept for the self-test
function buildSprite(name, rows, pal, opts = {}) {
  let grid = rows.map(r => r.split(''));
  if (opts.mirror) grid = grid.map(r => r.concat(r.slice().reverse()));
  const w = grid.length ? grid[0].length : 0;
  if (opts.h && grid.length < opts.h) {
    const pad = [];
    for (let i = grid.length; i < opts.h; i++) pad.push(new Array(w).fill('.'));
    grid = pad.concat(grid);
  }
  if (opts.overlay) {
    for (const ov of opts.overlay) {
      ov.rows.forEach((r, yy) => {
        for (let xx = 0; xx < r.length; xx++) {
          const ch = r[xx], gy = ov.y + yy, gx = ov.x + xx;
          if (ch !== '.' && grid[gy] && gx >= 0 && gx < w) grid[gy][gx] = ch;
        }
      });
    }
  }
  SPRITE_DEFS.push({ name, rows, pal, opts, w, h: grid.length });
  const c = makeCanvas(w, grid.length);
  const g = c.getContext('2d');
  grid.forEach((r, y) => r.forEach((ch, x) => {
    if (ch === '.' || ch === ' ') return;
    const col = pal[ch];
    if (!col) return;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }));
  return c;
}
function flipCanvas(src) {
  const c = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c;
}
const silCache = new Map();
function silhouette(src, color) {
  const key = color;
  if (!silCache.has(src)) silCache.set(src, {});
  const bucket = silCache.get(src);
  if (bucket[key]) return bucket[key];
  const c = bucket[key] = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height); return c;
}

function genRows(fn) { const r = []; for (let y = 0; y < 16; y++) { let s = ''; for (let x = 0; x < 16; x++) s += fn(x, y); r.push(s); } return r; }

// get an automatic dark outline, then details (eyes, noses) on top. Output is the usual array of strings.
function paintPet(base, detail) {
  let g = Array.from({ length: 32 }, () => new Array(32).fill('.'));
  const put = (x, y, c) => { if (x >= 0 && x < 32 && y >= 0 && y < 32) g[y][x] = c; };
  const sign = (ax, ay, bx, by, cx, cy) => (ax - cx) * (by - cy) - (bx - cx) * (ay - cy);
  const run = ops => {
    for (const op of ops) {
      const k = op[0];
      if (k === 'E') {
        const [, cx, cy, rx, ry, c] = op;
        for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
          const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
          if (dx * dx + dy * dy <= 1) put(x, y, c);
        }
      } else if (k === 'R') {
        const [, x, y, w, h, c] = op;
        for (let j = 0; j < Math.max(1, Math.round(h)); j++) for (let i = 0; i < Math.max(1, Math.round(w)); i++) put(Math.round(x) + i, Math.round(y) + j, c);
      } else if (k === 'P') put(Math.round(op[1]), Math.round(op[2]), op[3]);
      else if (k === 'T') {
        const [, ax, ay, bx, by, cx, cy, c] = op;
        for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
          const px = x + 0.5, py = y + 0.5;
          const d1 = sign(px, py, ax, ay, bx, by), d2 = sign(px, py, bx, by, cx, cy), d3 = sign(px, py, cx, cy, ax, ay);
          if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) put(x, y, c);
        }
      }
    }
  };
  run(base);
  const o = g.map(r => r.slice());
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    if (g[y][x] !== '.') continue;
    if ((x > 0 && g[y][x - 1] !== '.') || (x < 31 && g[y][x + 1] !== '.') || (y > 0 && g[y - 1][x] !== '.') || (y < 31 && g[y + 1][x] !== '.')) o[y][x] = 'o';

}

function M(...ops) {

    else if (k === 'R') out.push(['R', 32 - Math.round(op[1]) - Math.max(1, Math.round(op[3])), op[2], op[3], op[4], op[5]]);
    else if (k === 'P') out.push(['P', 31 - Math.round(op[1]), op[2], op[3]]);

function petStats(p) {
  const b = SPECIES[p.sp].base, L = p.lv;
  return {
    hp:  Math.floor(b.hp * L / 20) + L + 10,
    atk: Math.floor(b.atk * L / 25) + 5,
    def: Math.floor(b.def * L / 25) + 5,
    spd: Math.floor(b.spd * L / 25) + 5,

}

const ENEMY_DAMAGE = 0.75, XP_BONUS = 1.25;

function createPet(sp, lv) {
  lv = clamp(lv, 1, MAX_LV);
  const known = learnsetOf(sp).filter(e => e[0] <= lv).map(e => e[1]);
  const p = { sp, lv, xp: 0, hp: 0, moves: known.slice(-4), pending: [] };

// Adds XP; returns events: {t:'level', lv} | {t:'learn', move} | {t:'pending', move}
function gainXP(p, amount) {
  const ev = [];
  if (p.lv >= MAX_LV || p.hp <= 0) return ev;
  p.xp += amount;
  while (p.lv < MAX_LV && p.xp >= toNext(p.lv)) {
    p.xp -= toNext(p.lv);
    const oldMax = maxHp(p);
    p.lv++;
    const nm = maxHp(p);
    p.hp = Math.min(nm, p.hp + (nm - oldMax));
    ev.push({ t: 'level', lv: p.lv });
    for (const [l, m] of learnsetOf(p.sp)) {
      if (l !== p.lv || p.moves.includes(m)) continue;
      if (p.moves.length < 4) { p.moves.push(m); ev.push({ t: 'learn', move: m }); }
      else if (!p.pending.includes(m)) { p.pending.push(m); ev.push({ t: 'pending', move: m }); }
    }
  }
  if (p.lv >= MAX_LV) p.xp = 0;

  const base = Math.floor(((2 * L / 5 + 2) * mv.power * a.atk / d.def) / 50 + 2);

      enterMap(ex.to, tx, ty, ex.dir);
      await fadeTo(0, 10);
    });
    return;
  }
  const door = doorAt(m, G.x, G.y);
  if (door) { runScript(() => enterBuilding(door)); return; }
  if (tileAt(m, G.x, G.y) === 'P' && G.party.some(p => p.hp < maxHp(p))) {
    runScript(async () => { for (const p of G.party) healPet(p); sfx('heal'); await say(STORY.healPad); saveGame(); });
    return;
  }
  const info = TILE_INFO[tileAt(m, G.x, G.y)];
  if (info && info.grass) {
    sfx('grass');
    if (wildTable(m, G.x, G.y) && world.sinceBattle >= 3 && Math.random() < ENCOUNTER_RATE) {
      const wild = rollWild(m, G.x, G.y);
      if (wild) runScript(() => startBattle({ wild: true, enemies: [wild] }));
    }
  }
}
function interact() {

const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
async function talkTo(npc) {
  world.npcDir[npc.id] = OPPOSITE[G.dir];
  sfx('confirm');
  if (npc.trainer && !G.flags[npc.id]) {
    for (const l of npc.lines) await say(l, npc.name);
    const enemies = npc.trainer.team.map(([sp, lv]) => createPet(sp, lv));
    const res = await startBattle({ wild: false, enemies, trainer: npc, music: npc.music });
    if (res === 'win') {
      if (npc.onWin) await STORY_SCRIPTS[npc.onWin](npc);

        await say(npc.after[0], npc.name);
        if (npc.moveTo) await stepAside(npc);

      G.flags[npc.id] = true;
      saveGame();
    }
    return;
  }
  const lines = (G.flags.gizmo && npc.final) ? npc.final : (npc.trainer ? npc.after : npc.lines);

function drawWorld() {
  const m = world.map;
  const cx = Math.round(world.camX), cy = Math.round(world.camY);
  ctx.fillStyle = m.bg || (m.lab ? '#14121e' : '#1e5a2a'); ctx.fillRect(0, 0, W, H);
  const x0 = Math.floor(cx / TS), y0 = Math.floor(cy / TS);
  const wf = Math.floor(frame / 30) % 2;
  for (let ty = y0; ty <= y0 + Math.ceil(H / TS); ty++) {
    for (let tx = x0; tx <= x0 + Math.ceil(W / TS); tx++) {
      if (ty < 0 || tx < 0 || ty >= m.rows.length || tx >= m.rows[0].length) continue;
      const ch = m.rows[ty][tx];
      if (ch === 'C') { drawCage(tx, ty, tx * TS - cx, ty * TS - cy); continue; }
      const frames = TILES[ch] || TILES['.'];
      ctx.drawImage(frames[frames.length > 1 ? wf : 0], tx * TS - cx, ty * TS - cy);
    }
  }
  // Things that stand on the map, back to front.
  const things = [];
  for (const c of m.chests) things.push({ y: c.y, draw: () => {
    const open = !!G.chests[c.id];
    let oy = 0;
    if (world.chestAnim && world.chestAnim.id === c.id) oy = world.chestAnim.t < 10 ? -Math.round(Math.sin(world.chestAnim.t / 10 * Math.PI) * 3) : 0;
    ctx.drawImage(open ? SPR_CHEST_O : SPR_CHEST_C, c.x * TS - cx, c.y * TS - cy + oy);
    if (world.chestAnim && world.chestAnim.id === c.id && world.chestAnim.t > 6) {
      const t = world.chestAnim.t;
      ctx.fillStyle = '#ffe866';
      for (let k = 0; k < 5; k++) {
        const ang = k * 1.256 + t * 0.05, r = 4 + t * 0.35;
        ctx.fillRect(Math.round(c.x * TS - cx + 8 + Math.cos(ang) * r), Math.round(c.y * TS - cy + 4 - t * 0.2 + Math.sin(ang) * r * 0.5), 2, 2);
      }
    }
  } });
  for (const n of m.npcs) { const q = npcPos(n); things.push({ y: q.y, draw: () => {
    const d = world.npcDir[n.id] || q.dir;
    ctx.drawImage(PEOPLE[n.look][d][0], q.x * TS - cx, q.y * TS - cy - 2);
    if (n.trainer && !G.flags[n.id] && Math.floor(frame / 30) % 2 === 0) drawText('!', q.x * TS - cx + 6, q.y * TS - cy - 12, COL.red);
  } }); }
  const pp = playerPixel();
  const pf = world.moving && world.mt < 0.55 ? 1 : 0;
  things.push({ y: pp.y / TS + 0.01, draw: () => {
    const hop = emoteHop(world.emote);
    ctx.drawImage(PEOPLE.player[world.emote ? 'down' : G.dir][pf], Math.round(pp.x) - cx, Math.round(pp.y) - cy - 2 + hop);
    drawEmote(world.emote, Math.round(pp.x) - cx + 8, Math.round(pp.y) - cy - 2 + hop);
    if (!world.moving && TILE_INFO[tileAt(m, G.x, G.y)].grass) {
      ctx.drawImage(TILES[','][0], 0, 11, 16, 5, G.x * TS - cx, G.y * TS - cy + 11, 16, 5);
    }
  } });
  things.sort((a, b) => a.y - b.y).forEach(t => t.draw());
  for (const l of m.labels) {
    const w = textW(l.text) + 8, lx = Math.round(l.tx * TS - cx - w / 2), ly = Math.round(l.ty * TS - cy);
    ctx.fillStyle = COL.border; ctx.fillRect(lx, ly, w, 12);
    ctx.fillStyle = COL.paper; ctx.fillRect(lx + 1, ly + 1, w - 2, 10);
    drawText(l.text, lx + 4, ly + 2, COL.ink);
  }
  if (m.dark) { ctx.fillStyle = 'rgba(10,40,30,0.22)'; ctx.fillRect(0, 0, W, H); }
  if (world.banner > 0) {
    const a = Math.min(1, world.banner / 30);
    ctx.save(); ctx.globalAlpha = a;
    const w = textW(m.name) + 16;
    box(6, 6, w, 18);
    drawText(m.name, 14, 11, COL.ink);
    ctx.restore();
  }
}

// Returns true if an item was used (in battle this uses the turn).
async function bagMenu(inBattle, battle) {
  for (;;) {
    const n = ITEM_ORDER.length;
    const wild = inBattle && battle.wild ? battle.enemy : null;
    const i = await choose(bagOptions(battle).concat([{ label: '  Back' }]), {
      cancel: n, start: bagMenu.last || 0, x: W - 160, y: 22, minW: 150, title: 'Bag',
      info: k => k >= n ? 'Close the bag.' : (wild && ITEMS[ITEM_ORDER[k]].treat
        ? (likesTreat(wild, ITEM_ORDER[k]) ? '\u2665 The wild ' + petName(wild) + ' loves this! ' : 'The wild ' + petName(wild) + ' likes ' + favoriteTreats(wild).join(' or ') + '. ') + ITEMS[ITEM_ORDER[k]].desc
        : ITEMS[ITEM_ORDER[k]].desc),
    });
    if (i === n) return false;
    bagMenu.last = i;
    const key = ITEM_ORDER[i];
    if (G.bag[key] <= 0) { await say('You don\'t have any ' + ITEMS[key].pl + '.'); continue; }
    if (ITEMS[key].treat) {
      if (!inBattle) { await say('Treats are for making friends with wild pets. Offer one in a wild battle!'); continue; }
      if (!battle.wild) { await say('You can\'t give Treats to another trainer\'s pet!'); continue; }
      return { treat: key };
    }
    const t = await choosePet({ title: 'Use ' + ITEMS[key].name + ' on which pet?' });
    if (t < 0) continue;
    const used = await useHealItem(key, G.party[t]);
    if (used) return { used: true, pet: G.party[t] };
  }
}
async function useHealItem(key, p) {
  const max = maxHp(p);
  if (p.hp >= max) { await say(petName(p) + ' already has full HP!'); return false; }
  const before = p.hp;
  p.hp = Math.min(max, p.hp + ITEMS[key].heal);
  G.bag[key]--;
  sfx('heal');
  await say((before === 0 ? petName(p) + ' is back on its paws! ' : '') + petName(p) + ' got ' + (p.hp - before) + ' HP back.');
  return true;
}

function foeName(B, p) { return B.wild ? 'The wild ' + petName(p) : B.o.trainer.name + '\'s ' + petName(p); }
async function chooseAction(B) {
  for (;;) {
    const a = await actionMenu(B);
    if (a === 0) { const m = await moveMenu(B); if (m < 0) continue; return { kind: 'move', move: B.player.moves[m] }; }
    if (a === 1) {
      const r = await bagMenu(true, B);
      if (!r) continue;
      if (r.treat) return { kind: 'treat', key: r.treat };
      return { kind: 'item' };
    }
    if (a === 2) {
      const i = await choosePet({ title: 'Switch to which pet?' });
      if (i < 0) continue;
      const p = G.party[i];
      if (p === B.player) { await say(petName(p) + ' is already battling!'); continue; }
      if (isTired(p)) { await say(petName(p) + ' is too tired to battle. Heal it first!'); continue; }
      return { kind: 'switch', pet: p };
    }
    return { kind: 'run' };
  }
}
async function attack(B, isPlayer, moveId) {
  const att = isPlayer ? B.player : B.enemy, def = isPlayer ? B.enemy : B.player;
  const mv = MOVES[moveId];
  await bsay((isPlayer ? petName(att) : foeName(B, att)) + ' used ' + mv.name + '!');
  if (isPlayer) B.lungeP = 10; else B.lungeE = 10;
  await wait(10);
  const r = calcDamage(att, def, moveId), mult = r.mult;
  const dmg = isPlayer ? r.dmg : Math.max(1, Math.floor(r.dmg * ENEMY_DAMAGE));
  def.hp = Math.max(0, def.hp - dmg);
  sfx(mult > 1 ? 'superHit' : mult < 1 ? 'weakHit' : 'hit');
  if (isPlayer) B.hitE = 24; else B.hitP = 24;
  await settleHP(B);
  await wait(8);
  if (mult > 1) await bsay('It\'s super effective!');
  else if (mult < 1) await bsay('It\'s not very effective...');
}

async function battleTurn(B) {
  const act = await chooseAction(B);

    if (!B.wild) { await say('You can\'t run away from a trainer battle!'); return null; }
    sfx('run'); await bsay('You got away safely!'); return 'run';
  }
  if (act.kind === 'switch') {

    await bsay('Come back, ' + petName(B.player) + '!');
    B.showPlayer = false; await wait(10);
    B.setPlayer(act.pet);
    await bsay('Go, ' + petName(act.pet) + '!');
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  if (act.kind === 'item') { B.dispP = B.player.hp; const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null; }
  if (act.kind === 'treat') {
    if (await throwTreat(B, act.key)) return 'caught';
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }

  const playerFirst = petStats(B.player).spd >= petStats(B.enemy).spd;
  if (playerFirst) {
    await attack(B, true, act.move);
    if (isTired(B.enemy)) return onEnemyKO(B);
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  const r = await enemyTurn(B);
  if (r === 'lose') return 'lose';
  if (r === 'switched') return null;
  await attack(B, true, act.move);
  if (isTired(B.enemy)) return onEnemyKO(B);
  return null;
}

class EvolveScreen {
  constructor(from, to) { this.from = from; this.to = to; this.t = 0; this.done = false; this.opaque = true; }
  update() { this.t++; }
  draw() {
    ctx.fillStyle = '#1d1b3e'; ctx.fillRect(0, 0, W, H);
    for (let k = 0; k < 24; k++) {
      const a = k / 24 * Math.PI * 2 + this.t * 0.01, r = 60 + (this.t * 2 + k * 13) % 80;
      ctx.fillStyle = k % 2 ? '#ffd84a' : '#8fd3ff';
      ctx.fillRect(Math.round(W / 2 + Math.cos(a) * r), Math.round(90 + Math.sin(a) * r * 0.6), 2, 2);
    }
    const x = W / 2 - 32, y = 58;
    if (this.done) drawPetSprite(this.to, x, y, 2);
    else {
      const period = Math.max(3, 30 - Math.floor(this.t / 6));
      const showNew = Math.floor(this.t / period) % 2 === 1;
      drawPetSprite(showNew ? this.to : this.from, x, y, 2, this.t > 20 ? { silhouette: '#ffffff' } : {});
    }
  }
  hint() { return ''; }
}

// ---------------------------------------------------------------------
// 18. MAIN LOOP
// ---------------------------------------------------------------------
const STEP_MS = 1000 / 60;
let lastT = 0, acc = 0;
function update() {
  frame++;
  for (let i = timers.length - 1; i >= 0; i--) {
    if (--timers[i].n <= 0) { const t = timers[i]; timers.splice(i, 1); t.r(); }
  }
  updateFade();
  tickEmotes();
  const inp = inputQueue; inputQueue = [];
  const t = topScreen();
  if (t && t.update) t.update(fade.a >= 1 && fade.target >= 1 ? [] : inp);
  if (G && stack.length && !(stack[0] instanceof TitleScreen)) G.stats.time += 1 / 60;
  updateMusic();
}
function drawHintBar() {
  let s = '';
  for (let i = stack.length - 1; i >= 0; i--) { const h = stack[i].hint ? stack[i].hint() : ''; if (h) { s = h; break; } }
  if (stack[stack.length - 1] === overworld && busy) s = soundHint();
  ctx.fillStyle = COL.bar; ctx.fillRect(0, HINT_Y, W, H - HINT_Y);
  drawText(s, 4, HINT_Y + 1, COL.barText);
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  let start = 0;
  for (let i = stack.length - 1; i >= 0; i--) if (stack[i].opaque) { start = i; break; }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let i = start; i < stack.length; i++) stack[i].draw();
  if (fade.a > 0) { ctx.globalAlpha = fade.a; ctx.fillStyle = fade.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHintBar();
}
function loop(now) {
  if (!lastT) lastT = now;
  acc += Math.min(250, now - lastT); lastT = now;
  let n = 0;
  while (acc >= STEP_MS) {
    try { update(); } catch (e) { console.error(e); recoverFromError(); }
    acc -= STEP_MS;
    if (++n > 5) { acc = 0; break; }
  }
  try { render(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

// 19. SELF-TEST  (open the file with #test at the end of the URL)
// ---------------------------------------------------------------------
function runSelfTest() {
  const out = [];
  let fails = 0;
  const check = (name, ok, detail) => { out.push((ok ? 'PASS  ' : 'FAIL  ') + name + (ok ? '' : '  -> ' + detail)); if (!ok) fails++; };

  // Sprites
  const sErr = [];
  for (const d of SPRITE_DEFS) {
    const w0 = d.rows[0].length;
    d.rows.forEach((r, i) => {
      if (r.length !== w0) sErr.push(d.name + ' row ' + i + ' has ' + r.length + ' px, expected ' + w0);
      for (const ch of r) if (ch !== '.' && !d.pal[ch]) sErr.push(d.name + ' unknown colour "' + ch + '"');
    });
    if (d.name.startsWith('pet_')) {
      if (d.w !== 32 || d.h !== 32) sErr.push(d.name + ' is ' + d.w + 'x' + d.h + ', expected 32x32');
      for (const ov of d.opts.overlay || []) ov.rows.forEach(r => { if (ov.x + r.length > 32) sErr.push(d.name + ' tail out of bounds'); for (const ch of r) if (ch !== '.' && !d.pal[ch]) sErr.push(d.name + ' tail colour ' + ch); });
    } else if (!d.name.startsWith('treat') && !d.name.startsWith('emote_') && !d.name.startsWith('acc_') && (d.w !== 16 || d.h !== 16)) sErr.push(d.name + ' is ' + d.w + 'x' + d.h + ', expected 16x16');
  }
  check('All ' + SPRITE_DEFS.length + ' sprites are well-formed', !sErr.length, sErr.slice(0, 4).join('; '));
  const fErr = [];
  for (const ch in FONT) { const rows = FONT[ch].split(' '); if (rows.length < 7 || rows.length > 8 || rows.some(r => r.length !== 5)) fErr.push(JSON.stringify(ch)); }
  check('Pixel font glyphs are 5 px wide, 7-8 rows', !fErr.length, fErr.join(' '));

  // Data references
  const dErr = [];
  for (const fam in LEARNSETS) {
    const ls = LEARNSETS[fam];
    if (ls.length < 4 || ls.length > 6) dErr.push(fam + ' learnset size ' + ls.length);
    for (const [lv, m] of ls) { if (!MOVES[m]) dErr.push('missing move ' + m); if (lv < 1 || lv > MAX_LV) dErr.push('bad learn level ' + lv); }
  }
  for (const k in MOVES) { const m = MOVES[k]; if (!(m.type === 'Normal' || TYPES.includes(m.type)) || !(m.power > 0)) dErr.push('bad move ' + k); }
  for (const k in SPECIES) {
    const s = SPECIES[k];
    if (!TYPES.includes(s.type)) dErr.push(k + ' bad type');
    if (!LEARNSETS[s.fam]) dErr.push(k + ' no learnset');
    if (s.evo && !SPECIES[s.evo]) dErr.push(k + ' evolves into missing ' + s.evo);
    if (!PET_SPR[k]) dErr.push(k + ' has no sprite');
    for (const st of ['hp', 'atk', 'def', 'spd']) if (!(s.base[st] > 0)) dErr.push(k + ' bad ' + st);
    if (s.evo) { const e = SPECIES[s.evo].base; const ratio = (e.hp + e.atk + e.def + e.spd) / (s.base.hp + s.base.atk + s.base.def + s.base.spd); if (ratio < 1.2 || ratio > 1.4) dErr.push(k + ' evo ratio ' + ratio.toFixed(2)); }
  }
  for (const k in MAPS) {
    const m = MAPS[k];
    for (const n of m.npcs) { if (!PEOPLE[n.look]) dErr.push(n.id + ' bad look'); if (n.trainer) for (const [sp, lv] of n.trainer.team) if (!SPECIES[sp] || lv < 1 || lv > MAX_LV) dErr.push(n.id + ' bad team'); }
    for (const e of m.wild || []) if (!SPECIES[e.sp]) dErr.push(k + ' wild ' + e.sp);
    for (const c of m.chests) if (!c.coins && !ITEMS[c.item]) dErr.push(c.id + ' bad item');
  }
  if (ALL_CHESTS.length < 8 || new Set(ALL_CHESTS).size !== ALL_CHESTS.length) dErr.push('expected 8+ unique chests, found ' + ALL_CHESTS.length);
  check('Every move, pet, item and trainer reference exists', !dErr.length, dErr.slice(0, 4).join('; '));

  // Maps. First beat every trainer in an order the player could (proves the story can be finished),
  // then check everything else with the story finished (all trainers beaten, NPCs stepped aside).
  const savedG = G;
  const END_FLAGS = { gizmo: true };
  for (const k in MAPS) for (const n of MAPS[k].npcs) if (n.trainer) END_FLAGS[n.id] = true;
  const flood = m => {
    const seen = new Set([m.spawn.x + ',' + m.spawn.y]), q = [[m.spawn.x, m.spawn.y]];
    while (q.length) {
      const [x, y] = q.shift();
      if (exitAt(m, x, y) || doorAt(m, x, y)) continue;
      for (const d of Object.values(DIRS)) { const nx = x + d[0], ny = y + d[1], key = nx + ',' + ny; if (!seen.has(key) && isWalkable(m, nx, ny)) { seen.add(key); q.push([nx, ny]); } }
    }
    return seen;
  };
  for (const k in MAPS) {
    const m = MAPS[k], mErr = [];
    G = { flags: {} };
    const met = new Set();
    for (let more = true; more;) {
      more = false;
      const s = flood(m);
      for (const n of m.npcs) {
        const q = npcPos(n);
        if (!met.has(n.id) && Object.values(DIRS).some(d => s.has((q.x + d[0]) + ',' + (q.y + d[1])))) { met.add(n.id); if (n.trainer) { G.flags[n.id] = true; more = true; } }
      }
    }
    for (const n of m.npcs) if (!met.has(n.id)) mErr.push(n.id + ' can never be reached');
    G = { flags: END_FLAGS };
    const w = m.rows[0].length, h = m.rows.length;
    if (w > 48 || h > 32) mErr.push('too big ' + w + 'x' + h);
    m.rows.forEach((r, y) => { if (r.length !== w) mErr.push('row ' + y + ' is ' + r.length + ' wide'); for (const ch of r) if (!TILE_INFO[ch]) mErr.push('bad tile ' + ch); });
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if ((x === 0 || y === 0 || x === w - 1 || y === h - 1) && TILE_INFO[m.rows[y][x]] && TILE_INFO[m.rows[y][x]].walk && !exitAt(m, x, y)) mErr.push('open edge at ' + x + ',' + y);
    }
    const bad = (x, y) => !isWalkable(m, x, y) || exitAt(m, x, y) || doorAt(m, x, y);
    if (bad(m.spawn.x, m.spawn.y)) mErr.push('spawn blocked');
    // flood fill from spawn
    const seen = new Set(), q = [[m.spawn.x, m.spawn.y]];
    seen.add(m.spawn.x + ',' + m.spawn.y);
    while (q.length) {
      const [x, y] = q.shift();
      if (exitAt(m, x, y) || doorAt(m, x, y)) continue;   // stepping on these leaves the map
      for (const d of Object.values(DIRS)) {
        const nx = x + d[0], ny = y + d[1], key = nx + ',' + ny;
        if (!seen.has(key) && isWalkable(m, nx, ny)) { seen.add(key); q.push([nx, ny]); }
      }
    }
    const reach = (x, y) => seen.has(x + ',' + y);
    const nextTo = (x, y) => Object.values(DIRS).some(d => reach(x + d[0], y + d[1]) && !exitAt(m, x + d[0], y + d[1]) && !doorAt(m, x + d[0], y + d[1]));
    for (const e of m.exits) {
      for (let i = 0; i < e.w; i++) if (!reach(e.x + i, e.y)) mErr.push('exit to ' + e.to + ' unreachable');
      const t = MAPS[e.to];
      if (!t) { mErr.push('exit to missing map ' + e.to); continue; }
      for (let i = 0; i < e.w; i++) {
        const ax = e.tx + i, ay = e.ty;
        if (!isWalkable(t, ax, ay) || exitAt(t, ax, ay) || doorAt(t, ax, ay) || TILE_INFO[tileAt(t, ax, ay)].grass) mErr.push('bad arrival ' + e.to + ' ' + ax + ',' + ay);
      }
    }
    for (const d of m.doors) {
      if (!reach(d.x, d.y)) mErr.push(d.kind + ' door unreachable');
      if (bad(d.x, d.y + 1)) mErr.push(d.kind + ' door has no free tile in front');
    }
    for (const n of m.npcs) { const q = npcPos(n); if (!TILE_INFO[tileAt(m, q.x, q.y)].walk) mErr.push(n.id + ' stands in a wall'); if (!nextTo(q.x, q.y)) mErr.push(n.id + ' cannot be reached'); }
    for (const c of m.chests) { if (!TILE_INFO[tileAt(m, c.x, c.y)].walk) mErr.push(c.id + ' in a wall'); if (!nextTo(c.x, c.y)) mErr.push(c.id + ' cannot be reached'); }
    for (const n of m.npcs) if (n.moveTo && (!TILE_INFO[tileAt(m, n.moveTo.x, n.moveTo.y)].walk || exitAt(m, n.moveTo.x, n.moveTo.y))) mErr.push(n.id + ' steps aside into a wall');
    check('Map "' + m.name + '" (' + w + 'x' + h + ') is valid and fully reachable', !mErr.length, mErr.slice(0, 4).join('; '));
  }
  G = savedG;
  const exitPairs = [];
  for (const k in MAPS) for (const e of MAPS[k].exits) exitPairs.push(MAPS[e.to].exits.some(b => b.to === k));
  check('Every map exit has a way back', exitPairs.every(Boolean), 'one-way exit found');
  // Biomes: every baby pet lives somewhere in the wild, and every encounter tile/reed patch has pets.
  const found = new Set(), bErr2 = [];
  for (const k in MAPS) {
    const m = MAPS[k];
    for (const tab of [m.wild, m.pond, ...Object.values(m.byTile || {})]) if (tab) for (const e of tab) { if (!SPECIES[e.sp]) bErr2.push(k + ' ' + e.sp); found.add(e.sp); }
    m.rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (TILE_INFO[r[x]] && TILE_INFO[r[x]].grass && k !== 'pawsville' && !wildTable(m, x, y)) bErr2.push(k + ' grass without pets at ' + x + ',' + y); });
  }
  for (const k in SPECIES) if (SPECIES[k].evo && !found.has(k)) bErr2.push(SPECIES[k].name + ' lives nowhere');

  for (const k in pnames) for (const sp of pnames[k]) { const m = MAPS[k]; if (![m.wild, m.pond, ...Object.values(m.byTile || {})].some(t => t && t.some(e => e.sp === sp))) bErr2.push(sp + ' missing from ' + k); }
  check(Object.keys(MAPS).length + ' areas: every pet lives in a matching habitat', !bErr2.length, bErr2.slice(0, 4).join('; '));

  // 500 random battles
  const bErr = [];
  const sps = Object.keys(SPECIES);
  const petOk = (p, tag) => {
    const s = petStats(p);
    for (const st of ['hp', 'atk', 'def', 'spd']) if (!Number.isFinite(s[st]) || s[st] <= 0) bErr.push(tag + ' bad ' + st);
    if (!Number.isInteger(p.hp) || p.hp < 0 || p.hp > s.hp) bErr.push(tag + ' hp ' + p.hp + '/' + s.hp);
    if (!Number.isInteger(p.lv) || p.lv < 1 || p.lv > MAX_LV) bErr.push(tag + ' lv ' + p.lv);
    if (!Number.isInteger(p.xp) || p.xp < 0 || (p.lv < MAX_LV && p.xp >= toNext(p.lv)) || (p.lv === MAX_LV && p.xp !== 0)) bErr.push(tag + ' xp ' + p.xp);
    if (!p.moves.length || p.moves.length > 4 || p.moves.some(m => !MOVES[m]) || new Set(p.moves).size !== p.moves.length) bErr.push(tag + ' moves ' + p.moves);
  };
  let totalTurns = 0, superCount = 0;
  for (let i = 0; i < 500 && bErr.length < 5; i++) {
    const a = createPet(pick(sps), rint(1, MAX_LV)), b = createPet(pick(sps), rint(1, MAX_LV));
    petOk(a, 'new'); petOk(b, 'new');
    let turns = 0;
    while (!isTired(a) && !isTired(b) && turns < 300) {
      turns++;
      const order = petStats(a).spd >= petStats(b).spd ? [[a, b], [b, a]] : [[b, a], [a, b]];
      for (const [x, y] of order) {
        if (isTired(x) || isTired(y)) break;
        const m = enemyChooseMove(x, y);
        if (!MOVES[m]) { bErr.push('chose missing move ' + m); break; }
        const r = calcDamage(x, y, m);
        if (!Number.isInteger(r.dmg) || r.dmg < 1) bErr.push('bad damage ' + r.dmg);
        if (r.mult > 1) superCount++;
        y.hp = Math.max(0, y.hp - r.dmg);
        petOk(x, 'battle'); petOk(y, 'battle');
      }
    }
    totalTurns += turns;
    if (turns >= 300) bErr.push('battle never ended');
    const win = isTired(a) ? b : a, lose = win === a ? b : a;
    const c = catchChance(lose); if (!(c >= 0.05 && c <= 0.95)) bErr.push('catch chance ' + c);
    const lv0 = win.lv;
    gainXP(win, xpReward(lose.lv, i % 2 === 0));
    petOk(win, 'after xp');
    if (win.lv < lv0) bErr.push('level went down');
    if (canEvolve(win)) { const sp0 = win.sp; evolvePet(win); if (win.sp !== SPECIES[sp0].evo) bErr.push('evolution failed'); petOk(win, 'evolved'); }
  }
  const lvl = createPet('cookie', 1); gainXP(lvl, 1e7); petOk(lvl, 'max');
  if (lvl.lv !== MAX_LV) bErr.push('cap not reached');
  const fresh = createPet('buddy', 5);
  if (fresh.moves.length !== 2) bErr.push('Lv5 starter should know 2 moves');
  check('500 random battles: stats, HP, XP, levels and evolution stay valid', !bErr.length, bErr.slice(0, 4).join('; '));
  check('Battles take a sensible number of turns (avg ' + (totalTurns / 500).toFixed(1) + ')', totalTurns / 500 > 1.5 && totalTurns / 500 < 15, 'avg ' + totalTurns / 500);
  // Music compiles: every section has 4 bars of melody, valid notes, chords and drums.
  const tErr = [];
  for (const name in TRACKS) {
    const tr = TRACKS[name];
    for (const sn of tr.order.split(' ')) {
      const sec = tr.s[sn]; if (!sec) { tErr.push(name + ' missing section ' + sn); continue; }
      const chords = sec[0].split(' '), mel = sec[1].replace(/\|/g, ' ').trim().split(/\s+/);
      if (mel.length !== chords.length * 8) tErr.push(name + '.' + sn + ' melody has ' + mel.length + ' notes');
      for (const n of mel) if (n !== '_' && n !== '-' && !noteFreq(n)) tErr.push(name + ' bad note ' + n);
      for (const c of chords) if (!chordSemis(c)) tErr.push(name + ' bad chord ' + c);
      if (sec[2].length !== 8) tErr.push(name + '.' + sn + ' drums');
      if (!BASS_STYLES[sec[3]] || !ARP_STYLES[sec[4]]) tErr.push(name + '.' + sn + ' styles');
    }
    if (!tErr.length && !(compileTrack(name).len > 0)) tErr.push(name + ' empty');
  }
  for (const k in MAPS) if (!TRACKS[MAPS[k].music]) tErr.push(k + ' has no song');
  check(Object.keys(TRACKS).length + ' songs compile (melody, chords, bass, drums)', !tErr.length, tErr.slice(0, 4).join('; '));
  // Difficulty: a Lv 5 starter fighting alone should beat almost every Meadow pet.
  let easyWins = 0;
  for (let i = 0; i < 1000; i++) {
    const me = createPet(STARTERS[i % STARTERS.length], 5), foe = rollWild(MAPS.meadow);
    for (let turn = 0; turn < 60 && !isTired(me) && !isTired(foe); turn++) {
      const best = me.moves.reduce((a, m) => MOVES[m].power * typeMult(MOVES[m].type, petType(foe)) > MOVES[a].power * typeMult(MOVES[a].type, petType(foe)) ? m : a);
      const hitFoe = () => { foe.hp = Math.max(0, foe.hp - calcDamage(me, foe, best).dmg); };
      const hitMe = () => { me.hp = Math.max(0, me.hp - Math.max(1, Math.floor(calcDamage(foe, me, enemyChooseMove(foe, me)).dmg * ENEMY_DAMAGE))); };
      if (petStats(me).spd >= petStats(foe).spd) { hitFoe(); if (!isTired(foe)) hitMe(); } else { hitMe(); if (!isTired(me)) hitFoe(); }
    }
    if (isTired(foe)) easyWins++;
  }
  check('Easy fights: a Lv 5 starter beats ' + (easyWins / 10).toFixed(0) + '% of Meadow pets on its own', easyWins >= 900, (easyWins / 10) + '%');
  // Treats: every kind of pet likes something the shop sells, and favourites work better than other snacks.

  for (const k of TREAT_KEYS) if (!TYPES.some(t => TREAT_LIKES[t].includes(k))) trErr.push('nobody likes ' + k);
  for (const k in SPECIES) { const q = createPet(k, 8); q.hp = 1; for (const tk of TREAT_KEYS) if (likesTreat(q, tk) ? treatChance(q, tk) < catchChance(q) : treatChance(q, tk) >= catchChance(q) * 0.5) trErr.push(k + '/' + tk); }
  check(TREAT_KEYS.length + ' kinds of treats: every pet has a favorite and the wrong snack rarely works', !trErr.length, trErr.slice(0, 4).join('; '));
  check(Object.keys(SPECIES).length + ' pets, ' + TYPES.length + ' types, ' + Object.keys(MOVES).length + ' moves', Object.keys(SPECIES).length === 32, 'expected 32 pets');
  check('Every type beats at least one type and loses to at least one', TYPES.every(t => BEATS[t].length > 0 && weakTo(t).length > 0) && typeMult('Parrot', 'Lizard') === 1.5 && typeMult('Lizard', 'Cat') === 1.5 && typeMult('Cat', 'Parrot') === 1.5, 'unbalanced chart');
  check('Type chart produces super-effective hits', superCount > 0 && typeMult('Dog', 'Cat') === 1.5 && typeMult('Cat', 'Dog') === 0.67 && typeMult('Dog', 'Hamster') === 1 && typeMult('Normal', 'Cat') === 1, 'type chart wrong');

  // UI text fits at 432x240

  if (252 + textW(longName) > 416 - textW('Lv 20') - 4) uErr.push('player name box');
  for (const k in MOVES) { if (textW(MOVES[k].name) > 86) uErr.push('move name ' + MOVES[k].name); }
  for (const t of TYPES.concat(['Normal'])) if (textW(t) + 6 > 54) uErr.push('type tag ' + t);
  for (const t of TYPES) { if (textW(strongText(t) + '.  ' + weakText(t) + '.') > DLG.w - 20) uErr.push('type line ' + t); if (176 + textW(strongText(t)) > 424 || 176 + textW(weakText(t)) > 424) uErr.push('summary ' + t); }
  for (const k in SPECIES) for (const t of favoriteTreats({ sp: k })) if (290 + textW(t) > 424) uErr.push('loves line ' + k);
  if (ITEM_ORDER.length + 1 > 12) uErr.push('bag list too long');

  for (const k in MAPS) for (const c of MAPS[k].chests) texts.push('You found ' + chestLabel(c) + '!');
  for (const k in SPECIES) texts.push((SPECIES[k].desc || ''), 'Champion Maple\'s ' + SPECIES[k].name + ' used Whisker Swipe!', SPECIES[k].name + ' wants to learn Pouch Cannon! But a pet can only know 4 moves.');
  texts.push('Your party is full, so ' + longName + ' went to rest in the Pet Pen at the Clinic.');
  let maxPages = 0;
  const longest = 'W'.repeat(NAME_MAX);
  for (let i = 0; i < texts.length; i++) texts[i] = String(texts[i]).replace(/\{name\}/g, longest);
  texts.push('From now on, your Hopscotch is called ' + longest + '!', 'Do you want to give ' + longest + ' a nickname?', longest + ' grew into a Squeakers! It looks stronger than ever!');
  if (252 + textW(longest) > 416 - textW('Lv 20') - 4) uErr.push('nickname in battle box');
  if (44 + textW(longest) + 8 + textW('Lv 20') > 208) uErr.push('nickname on party card');

  const summary = fails ? 'SELF-TEST FAIL (' + fails + ' failed)' : 'SELF-TEST PASS (' + out.length + ' checks)';

}

// Automated play-through with synthetic key presses (#view=smoke). Results go to the console and #testout.
async function runSmoke() {
  const log = [];
  let fails = 0;
  const ok = (name, cond) => { log.push((cond ? 'PASS  ' : 'FAIL  ') + name); if (!cond) fails++; };
  const keyName = code => code === 'Enter' ? 'Enter' : code === 'Space' ? ' ' : code === 'Escape' ? 'Escape' : code === 'Backspace' ? 'Backspace' : code.startsWith('Key') ? code.slice(3).toLowerCase() : code;
  const typeText = async str => { for (const ch of str) { window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Key' + ch.toUpperCase(), key: ch })); await wait(2); } };
  const key = async (code, hold = 2) => {
    window.dispatchEvent(new KeyboardEvent('keydown', { code, key: keyName(code) }));
    await wait(hold);
    window.dispatchEvent(new KeyboardEvent('keyup', { code }));
    await wait(3);
  };
  const idle = () => topScreen() === overworld && !busy && fade.a === 0;
  const mash = async (until, max = 600, code = 'Enter') => { for (let i = 0; i < max && !until(); i++) { await key(code); await wait(6); } return until(); };
  try {
    pop(topScreen()); push(new SplashScreen());

    await key('Space');                       // splash -> studio card
    await wait(5);
    ok('Pressing a key on the splash starts the studio intro', topScreen() instanceof IntroScreen);
    await key('Enter'); await wait(5);        // Enter -> next scene
    ok('Enter moves to the next intro scene', topScreen() instanceof IntroScreen && topScreen().i === 1);
    await key('Space'); await wait(40);       // Space skips the rest
    ok('Space skips the intro to the title screen', topScreen() instanceof TitleScreen);

    await key('Enter');                       // title -> menu

    await key('ArrowRight');                  // Mittens
    await key('Enter'); await wait(5);
    await key('Enter');                       // Yes
    ok('Reached the overworld after the intro', await mash(idle));
    ok('Your name is Sam and the starter kept its name (empty nickname)', G.name === 'Sam' && petName(G.party[0]) === 'Mittens');

    runScript(() => customizePet(G.party[0])); await wait(5);
    await key('ArrowRight'); await key('ArrowRight'); await key('ArrowDown'); await key('ArrowRight'); await key('Enter');
    await mash(idle, 20);
    ok('A pet can wear a pink top hat (' + JSON.stringify(G.party[0].acc) + ')', G.party[0].acc && G.party[0].acc.kind === 'tophat' && G.party[0].acc.color === 1);
    // H = home, with a confirmation first.

    await key('ArrowDown'); await key('Enter'); await mash(idle, 20);
    ok('Saying No keeps you where you are', G.map === 'meadow' && G.x === 21);
    await key('KeyH'); await wait(5); await key('Enter');
    await mash(idle, 40);
    ok('Saying Yes teleports you home', G.map === 'pawsville' && G.x === HOME.x && G.y === HOME.y);
    G.party[0].nick = undefined; G.party[0].acc = null;
    // New areas: walk east out of town to the farm, then back.
    enterMap('pawsville', 30, 7, 'right'); await wait(5);
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyD' })); await wait(20);
    window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyD' })); await wait(40);
    ok('Walking east from town reaches Sunny Farm', G.map === 'farm' && !exitAt(world.map, G.x, G.y));
    ok('Piglets live in the mud, puppies in the wheat, ducklings by the pond',
      wildTable(MAPS.farm, 15, 4)[0].sp === 'truffle' && wildTable(MAPS.farm, 4, 13).some(e => e.sp === 'buddy') && wildTable(MAPS.farm, 16, 13).some(e => e.sp === 'puddles'));
    enterMap('pawsville', HOME.x, HOME.y, 'down'); await wait(5);
    ok('Started with Mittens Lv 5, 3 Fish + 1 of every other treat, 2 Bandages, 100 coins', G && G.party[0].sp === 'mittens' && G.party[0].lv === 5 && G.bag.fish === 3 && G.bag.bone === 1 && G.bag.bandage === 2 && G.coins === 100);
    // Walk: turn and walk right along the path.
    const x0 = G.x;
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyD' })); await wait(60);
    window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyD' })); await wait(20);
    ok('Holding D walks the player (x ' + x0 + ' -> ' + G.x + ')', G.x > x0 + 2);
    await key('KeyV');
    ok('V makes the player emote (' + (world.emote && world.emote.kind) + ')', !!world.emote);
    await wait(EMOTE_LEN + 5);
    await key('KeyV');
    ok('Pressing V again shows a different emote (' + (world.emote && world.emote.kind) + ')', !!world.emote && world.emote.kind !== EMOTES[0]);
    // Walk into the clinic door from below.
    enterMap('pawsville', 26, 7, 'up'); await wait(5);
    G.party[0].hp = 3;
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyW' })); await wait(14);
    window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyW' }));
    await wait(80);
    ok('Walking into the door opens the Pet Clinic', stack.some(s => s instanceof BuildingScreen));
    await mash(() => topScreen() instanceof ChoiceScreen, 20);
    await key('Enter');                       // Heal my pets
    await mash(() => topScreen() instanceof ChoiceScreen, 30);
    ok('Clinic healed the party', G.party[0].hp === maxHp(G.party[0]));
    await key('ArrowUp'); await key('Enter');  // Leave (wraps to last)
    ok('Left the clinic and stand in front of the door', await mash(idle, 40) && G.x === 26 && G.y === 6);
    // Map transition: walk north through the town gate.
    enterMap('pawsville', 15, 2, 'up'); await wait(5);
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'ArrowUp' })); await wait(50);
    window.dispatchEvent(new KeyboardEvent('keyup', { code: 'ArrowUp' })); await wait(40);
    ok('Walking through the gate enters Meadow Path', G.map === 'meadow' && !exitAt(world.map, G.x, G.y));
    // Wild battle: fight with Enter until it ends.
    G.party[0] = createPet('mittens', 8);
    const wins0 = G.stats.wins;
    runScript(() => startBattle({ wild: true, enemies: [createPet('alvin', 3)] }));
    await wait(5);
    ok('Wild battle won by mashing Enter', await mash(idle, 800) && G.stats.wins === wins0 + 1);
    ok('Won coins for the battle', G.coins === 130);
    // Catch: weakened wild gerbil, Bag -> Seeds (its favourite, marked with a heart).
    const e = createPet('cookie', 4); e.hp = 1;
    const p0 = G.party.length, treats = G.bag.seeds;
    runScript(() => startBattle({ wild: true, enemies: [e] }));
    await mash(() => topScreen() instanceof ActionMenu, 300);
    await key('KeyV');
    ok('V makes your pet emote in battle', !!(stack.find(s => s instanceof BattleScreen) || {}).emote);
    await wait(EMOTE_LEN + 5);
    await key('ArrowRight'); await key('Enter');    // Bag
    await wait(5);
    ok('The Bag marks Seeds with a heart for a wild gerbil', topScreen() instanceof ChoiceScreen && topScreen().opts[2].label.startsWith('\u2665') && !topScreen().opts[0].label.startsWith('\u2665'));
    await key('ArrowDown'); await key('ArrowDown'); await key('Enter');   // Seeds
    await mash(idle, 800);
    ok('Seeds used (' + treats + ' -> ' + G.bag.seeds + ')', G.bag.seeds === treats - 1 || G.bag.seeds === treats - 2);
    ok('Caught pet joins the party (party ' + p0 + ' -> ' + G.party.length + ')', G.party.length >= p0 + (G.stats.caught ? 1 : 0) && G.stats.caught <= 1);
    // Trainer battle: Treat is refused and Run is refused without losing the turn.
    G.party = [createPet('buddy', 2)];
    const coins0 = G.coins;
    const champ = MAPS.woods.npcs.find(n => n.id === 'maple');
    // Wrong treat: a cat offered Bugs usually refuses.
    { const realRandom = Math.random; Math.random = () => 0.1;
      const cat = createPet('mittens', 4); cat.hp = 1; G.party = [createPet('buddy', 9)];
      const bugs0 = G.bag.bugs = 1;
      runScript(() => startBattle({ wild: true, enemies: [cat] }));
      await mash(() => topScreen() instanceof ActionMenu, 300);
      bagMenu.last = 3;
      await key('ArrowRight'); await key('Enter'); await wait(4); await key('Enter');   // Bag -> Bugs
      let refusedMsg = false;
      for (let i = 0; i < 400 && !refusedMsg; i++) { const t = topScreen(); if (t instanceof MessageScreen && t.pages.flat().join(' ').includes('turns up its nose')) refusedMsg = true; await wait(2); }
      Math.random = realRandom;
      ok('A cat turns up its nose at Bugs (wrong treat)', refusedMsg && G.bag.bugs === bugs0 - 1 && !G.party.includes(cat));
      await mash(() => topScreen() instanceof ActionMenu, 100);
      await key('ArrowDown'); await key('Enter');                                         // Bag -> Run (cursor remembers Bag)
      ok('Running away from the picky cat works', await mash(idle, 200));
      G.party = [createPet('buddy', 2)];
      bagMenu.last = 0; }
    enterMap('woods', 24, 3, 'up');
    runScript(() => talkTo(champ));
    await mash(() => topScreen() instanceof ActionMenu, 300);
    bagMenu.last = 0;
    await key('ArrowRight'); await key('Enter'); await wait(4); await key('Enter');   // Bag -> Bone
    await wait(10);
    const refused = topScreen() instanceof MessageScreen && topScreen().pages[0].join(' ').includes('can\'t give Treats');
    ok('Treats are refused in trainer battles', refused);
    await mash(() => topScreen() instanceof ChoiceScreen, 10);   // message closes, the Bag is shown again
    await key('Escape');                                         // close the Bag
    await wait(5);
    ok('...and the turn was not lost (back at the action menu, ' + G.party[0].hp + ' HP)', topScreen() instanceof ActionMenu && G.party[0].hp === maxHp(G.party[0]));
    // Lose to the Champion on purpose: blackout -> clinic, coins -25%.
    await key('ArrowLeft');                                      // cursor remembers 'Bag': move back to 'Fight'
    const lostOk = await mash(idle, 1500);
    ok('Losing sends you back to the Clinic', lostOk && G.map === 'pawsville' && G.x === 26 && G.y === 6);
    if (!lostOk || G.map !== 'pawsville') log.push('   state: top=' + (topScreen() && topScreen().constructor.name) + ' busy=' + busy + ' fade=' + fade.a + '/' + fade.target + ' map=' + G.map + ' ' + G.x + ',' + G.y + ' stack=' + stack.map(s => s.constructor.name).join('>') + ' hp=' + G.party.map(q => q.hp).join(','));
    ok('Lost 25% of coins (' + coins0 + ' -> ' + G.coins + ') and the party is healed', G.coins === coins0 - Math.floor(coins0 * 0.25) && G.party.every(p => p.hp === maxHp(p)));
    ok('Champion not marked as beaten', !G.flags.maple);
    // Chest
    enterMap('pawsville', 9, 3, 'up');
    await key('Enter');
    await mash(idle, 40);
    ok('Chest gives 3 Treats and stays open', G.chests.paw1 === true);
    await key('Enter'); await wait(5);
    ok('Opened chest says it is empty', topScreen() instanceof MessageScreen && topScreen().pages[0][0].includes('empty'));
    await mash(idle, 20);
    // Evolution + learning after level-up
    G.party = [createPet('cookie', 9)]; G.party[0].xp = toNext(9) - 1;
    runScript(() => startBattle({ wild: true, enemies: [createPet('buddy', 2)] }));
    ok('Battle finished and Cookie evolved into Cream', await mash(idle, 1500) && G.party[0].sp === 'cream');
    // Beat the Champion: she reveals Dr. Gizmo and steps aside from the lab path.
    G.party = [createPet('rocky', 20), createPet('shadow', 20)];
    G.party.forEach(q => { q.moves = ['howlwave', 'purrstorm'].filter(m => learnsetOf(q.sp).some(e => e[1] === m)).concat(['pounce']); });
    ok('The lab path is blocked before the Champion is beaten', !isWalkable(MAPS.woods, 24, 1));
    enterMap('woods', 24, 2, 'up');
    runScript(() => talkTo(champ));
    ok('Champion battle won and she steps aside', await mash(idle, 2000) && G.flags.maple === true && npcPos(champ).x === 22 && !G.flags.gizmo);
    ok('No win screen yet (the story continues)', !stack.some(s => s instanceof WinScreen));
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyW' })); await wait(40);
    window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyW' })); await wait(40);
    ok('Walking north enters Gizmo\'s Lab', await mash(idle, 10) && G.map === 'lab');
    const bolt = MAPS.lab.npcs.find(n => n.id === 'bolt'), gizmo = MAPS.lab.npcs.find(n => n.id === 'gizmo');
    ok('Lab Helper Bolt blocks the door', !isWalkable(MAPS.lab, 11, 10));
    enterMap('lab', 11, 11, 'up');
    runScript(() => talkTo(bolt));
    ok('Beat Bolt and he steps aside', await mash(idle, 2000) && G.flags.bolt === true && isWalkable(MAPS.lab, 11, 10));
    enterMap('lab', 11, 4, 'up');
    runScript(() => talkTo(gizmo));
    let sawWin = false;
    for (let i = 0; i < 3000 && !(sawWin && idle()); i++) { if (topScreen() instanceof WinScreen) sawWin = true; await key('Enter'); await wait(6); }
    ok('Beating Dr. Gizmo frees the pets and shows the win screen', sawWin && G.flags.gizmo === true);
    ok('A grateful Kiwi joins the team', G.party.some(q => q.sp === 'kiwi' || q.sp === 'mango'));
    ok('After the win screen you can keep exploring', idle() && G.map === 'lab');
    ok('Never ended with an error and the screen stack is clean', stack.length === 1);
  } catch (err) { ok('No exceptions: ' + err, false); }
  const text = (fails ? 'SMOKE FAIL (' + fails + ')' : 'SMOKE PASS (' + log.length + ' checks)') + '\n' + log.join('\n');
  console.log(text);
  document.getElementById('testout').textContent = text;
}

// ---------------------------------------------------------------------
// 21. BOOT
// ---------------------------------------------------------------------
function boot() {
  buildAllSprites();
  if (TEST_MODE) runSelfTest();
  else if (VIEW) devView(VIEW);
  else push(new SplashScreen());
  if (VIEW === 'smoke') {   // headless browsers barely run animation frames: step the game with a timer instead
    const tick = () => { try { update(); } catch (e) { console.error(e); } setTimeout(tick, 2); };
    tick();
    return;
  }
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
</html>
