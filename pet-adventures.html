    let s = land ? Math.min(ah / H, (aw - 2 * side) / W) : Math.min(aw / W, ah * 0.58 / H);
    const whole = Math.floor(s + 0.25);                            // snap up to whole pixels if it still fits (iPad)
    if (whole >= 2 && whole * H <= ah && whole * W <= (land ? aw - 1.4 * side : aw)) s = whole;
    s = Math.max(0.5, s);

function toggleFullscreen() {
  try {
    const el = document.documentElement;

      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});

    } else {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  } catch (e) { /* fullscreen not available - ignore */ }
  setTimeout(fitCanvas, 120);
}

const FW = 6, FH = 8, LINE_H = 10;
const fontIndex = {};
let fontAtlas = null;
const tintCache = {};
function buildFont() {
  const chars = Object.keys(FONT);
  fontAtlas = makeCanvas(chars.length * FW, FH);
  const g = fontAtlas.getContext('2d');
  g.fillStyle = '#fff';
  chars.forEach((ch, i) => {
    fontIndex[ch] = i;
    FONT[ch].split(' ').forEach((row, y) => {
      for (let x = 0; x < row.length; x++) if (row[x] === '#') g.fillRect(i * FW + x, y, 1, 1);
    });
  });
}
function tinted(color) {
  let c = tintCache[color];
  if (!c) {
    c = makeCanvas(fontAtlas.width, fontAtlas.height);
    const g = c.getContext('2d');
    g.drawImage(fontAtlas, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, c.width, c.height);
    tintCache[color] = c;
  }
  return c;
}
function textW(str, s = 1) { str = String(str); return str.length ? (str.length * FW - 1) * s : 0; }
function drawText(str, x, y, color = COL.ink, s = 1, shadow = null) {
  str = String(str);
  if (shadow) { const o = Math.min(s, 2); drawText(str, x + o, y + o, shadow, s, null); }
  const img = tinted(color);
  x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === ' ') continue;
    let idx = fontIndex[ch];
    if (idx === undefined) idx = fontIndex['?'];
    ctx.drawImage(img, idx * FW, 0, 5, FH, x + i * FW * s, y, 5 * s, FH * s);
  }
}
function drawTextC(str, cx, y, color, s = 1, shadow = null) { drawText(str, Math.round(cx - textW(str, s) / 2), y, color, s, shadow); }
function drawTextR(str, rx, y, color, s = 1) { drawText(str, rx - textW(str, s), y, color, s); }
// Word-wrap by exact pixel width of the pixel font.
function wrapText(text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word0 of para.split(' ')) {
      let word = word0;
      const t = line ? line + ' ' + word : word;
      if (textW(t) <= maxW) { line = t; continue; }
      if (line) out.push(line);
      const n = Math.max(1, Math.floor((maxW + 1) / FW));
      while (textW(word) > maxW) { out.push(word.slice(0, n)); word = word.slice(n); }
      line = word;
    }
    out.push(line);
  }
  return out;
}

// 3. SPRITES (string arrays + palettes, rendered once to canvases)
// ---------------------------------------------------------------------
const SPRITE_DEFS = [];   // kept for the self-test
function buildSprite(name, rows, pal, opts = {}) {
  let grid = rows.map(r => r.split(''));
  if (opts.mirror) grid = grid.map(r => r.concat(r.slice().reverse()));
  const w = grid.length ? grid[0].length : 0;
  if (opts.h && grid.length < opts.h) {
    const pad = [];
    for (let i = grid.length; i < opts.h; i++) pad.push(new Array(w).fill('.'));
    grid = pad.concat(grid);
  }
  if (opts.overlay) {
    for (const ov of opts.overlay) {
      ov.rows.forEach((r, yy) => {
        for (let xx = 0; xx < r.length; xx++) {
          const ch = r[xx], gy = ov.y + yy, gx = ov.x + xx;
          if (ch !== '.' && grid[gy] && gx >= 0 && gx < w) grid[gy][gx] = ch;
        }
      });
    }
  }
  SPRITE_DEFS.push({ name, rows, pal, opts, w, h: grid.length });
  const c = makeCanvas(w, grid.length);
  const g = c.getContext('2d');
  grid.forEach((r, y) => r.forEach((ch, x) => {
    if (ch === '.' || ch === ' ') return;
    const col = pal[ch];
    if (!col) return;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }));
  return c;
}
function flipCanvas(src) {
  const c = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c;
}
const silCache = new Map();
function silhouette(src, color) {
  const key = color;
  if (!silCache.has(src)) silCache.set(src, {});
  const bucket = silCache.get(src);
  if (bucket[key]) return bucket[key];
  const c = bucket[key] = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height); return c;
}

function paintPet(base, detail) {

  const put = (x, y, c) => { if (x >= 0 && x < 32 && y >= 0 && y < 32) g[y][x] = c; };
  const sign = (ax, ay, bx, by, cx, cy) => (ax - cx) * (by - cy) - (bx - cx) * (ay - cy);
  const run = ops => {
    for (const op of ops) {
      const k = op[0];
      if (k === 'E') {
        const [, cx, cy, rx, ry, c] = op;
        for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
          const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
          if (dx * dx + dy * dy <= 1) put(x, y, c);
        }
      } else if (k === 'R') {
        const [, x, y, w, h, c] = op;
        for (let j = 0; j < Math.max(1, Math.round(h)); j++) for (let i = 0; i < Math.max(1, Math.round(w)); i++) put(Math.round(x) + i, Math.round(y) + j, c);
      } else if (k === 'P') put(Math.round(op[1]), Math.round(op[2]), op[3]);
      else if (k === 'T') {
        const [, ax, ay, bx, by, cx, cy, c] = op;
        for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
          const px = x + 0.5, py = y + 0.5;
          const d1 = sign(px, py, ax, ay, bx, by), d2 = sign(px, py, bx, by, cx, cy), d3 = sign(px, py, cx, cy, ax, ay);
          if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) put(x, y, c);
        }
      }
    }
  };
  run(base);
  const o = g.map(r => r.slice());
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    if (g[y][x] !== '.') continue;
    if ((x > 0 && g[y][x - 1] !== '.') || (x < 31 && g[y][x + 1] !== '.') || (y > 0 && g[y - 1][x] !== '.') || (y < 31 && g[y + 1][x] !== '.')) o[y][x] = 'o';

function petStats(p) {
  const b = SPECIES[p.sp].base, L = p.lv;
  return {
    hp:  Math.floor(b.hp * L / 20) + L + 10,
    atk: Math.floor(b.atk * L / 25) + 5,
    def: Math.floor(b.def * L / 25) + 5,
    spd: Math.floor(b.spd * L / 25) + 5,
  };
}
function maxHp(p) { return Math.floor(petStats(p).hp * (p.boss || 1)); }   // p.boss: a boss pet fights alone, so its HP is multiplied (the boss's `hp` in the map data)
function petName(p) { return p.nick || SPECIES[p.sp].name; }
const NAME_MAX = 10;
function cleanName(s) { return String(s || '').replace(/[^A-Za-z0-9 '.\-]/g, '').replace(/\s+/g, ' ').trim().slice(0, NAME_MAX); }
function petType(p) { return SPECIES[p.sp].type; }
function learnsetOf(sp) { return LEARNSETS[SPECIES[sp].fam]; }
function toNext(lv) { return 12 * lv * lv; }   // 20% more than the first versions' 10 * lv * lv
// Kid-friendly difficulty: enemies hit softer, pets learn faster.
const ENEMY_DAMAGE = 0.85, XP_BONUS = 1.25;
function xpReward(enemyLv, trainer) { return Math.floor((5 * enemyLv * enemyLv + 10) * (trainer ? 1.5 : 1) * XP_BONUS); }
const FOE_MAX_LV = 30;   // the highest level a trainer's or boss's pet may have
function createPet(sp, lv, cap = MAX_LV) {
  lv = clamp(lv, 1, cap);
  const known = learnsetOf(sp).filter(e => e[0] <= lv).map(e => e[1]);
  const p = { sp, lv, xp: 0, hp: 0, moves: known.slice(-4), pending: [] };
  p.hp = maxHp(p);
  return p;
}
// Adds XP; returns events: {t:'level', lv} | {t:'learn', move} | {t:'pending', move}
function gainXP(p, amount) {
  const ev = [];
  if (p.lv >= MAX_LV || p.hp <= 0) return ev;
  p.xp += amount;
  while (p.lv < MAX_LV && p.xp >= toNext(p.lv)) {
    p.xp -= toNext(p.lv);
    const oldMax = maxHp(p);
    p.lv++;
    const nm = maxHp(p);
    p.hp = Math.min(nm, p.hp + (nm - oldMax));
    ev.push({ t: 'level', lv: p.lv });
    for (const [l, m] of learnsetOf(p.sp)) {
      if (l !== p.lv || p.moves.includes(m)) continue;
      if (p.moves.length < 4) { p.moves.push(m); ev.push({ t: 'learn', move: m }); }
      else if (!p.pending.includes(m)) { p.pending.push(m); ev.push({ t: 'pending', move: m }); }
    }
  }
  if (p.lv >= MAX_LV) p.xp = 0;
  return ev;
}
function canEvolve(p) { const s = SPECIES[p.sp]; return !!(s.evo && p.lv >= s.evoLv); }
function evolvePet(p, to = SPECIES[p.sp].evo) {
  const oldMax = maxHp(p);
  p.sp = to;
  const nm = maxHp(p);
  if (p.hp > 0) p.hp = Math.min(nm, p.hp + (nm - oldMax));
}
function calcDamage(att, def, moveId, rnd = Math.random) {
  const mv = MOVES[moveId];
  const a = petStats(att), d = petStats(def);
  const L = att.lv;
  const base = Math.floor(((2 * L / 5 + 2) * mv.power * a.atk / d.def) / 50 + 2);
  const mult = typeMult(mv.type, petType(def));
  const dmg = Math.max(1, Math.floor(base * mult * (0.85 + rnd() * 0.15)));
  return { dmg, mult };
}
function catchChance(p) { return clamp(0.25 + 0.6 * (1 - p.hp / maxHp(p)), 0.05, 0.95); }
// A favourite treat helps; the wrong treat rarely works (and is usually refused before it's even eaten).
function treatChance(p, key) { return likesTreat(p, key) ? Math.min(0.95, catchChance(p) * 1.2) : catchChance(p) * 0.3; }

function enemyChooseMove(e, target) {
  if (Math.random() < 0.5) return pick(e.moves);
  let best = e.moves[0], bv = -1;
  for (const m of e.moves) {

}

function tileAt(map, x, y) {
  if (y < 0 || y >= map.rows.length || x < 0 || x >= map.rows[0].length) return 'T';
  return map.rows[y][x];
}
function exitAt(map, x, y) {
  return map.exits.find(e => x >= e.x && x < e.x + e.w && y >= e.y && y < e.y + e.h) || null;
}
function doorAt(map, x, y) { return map.doors.find(d => d.x === x && d.y === y) || null; }
// NPCs with moveTo step aside once they've been beaten.
function npcPos(n) {
  if (n.moveTo && G && G.flags && G.flags[n.id]) return n.moveTo;
  return n;
}
function npcAt(map, x, y) { return map.npcs.find(n => { const q = npcPos(n); return q.x === x && q.y === y; }) || null; }
function chestAt(map, x, y) { return map.chests.find(c => c.x === x && c.y === y) || null; }
function isWalkable(map, x, y) {
  const info = TILE_INFO[tileAt(map, x, y)];
  if (!info || !info.walk) return false;
  if (npcAt(map, x, y) || chestAt(map, x, y) || questObjAt(map, x, y) || puzzleObjAt(map, x, y)) return false;
  return true;
}
function nearWater(map, x, y) {
  if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (tileAt(map, x + dx, y + dy) === '~') return true;   // two tiles: reed beds are wider since the maps grew
  return false;
}
function wildTable(map, x, y) {
  const ch = Number.isFinite(x) ? tileAt(map, x, y) : null;
  if (map.byTile && map.byTile[ch]) return map.byTile[ch];   // e.g. piglets live in the mud
  if (map.pond && nearWater(map, x, y)) return map.pond;     // water pets live in the reeds
  return map.wild;
}
function rollWild(map, x, y) {
  const tab = wildTable(map, x, y); if (!tab) return null;
  let total = 0; for (const e of tab) total += e.w;
  let r = Math.random() * total;
  for (const e of tab) { r -= e.w; if (r <= 0) return createPet(e.sp, rint(e.min, e.max)); }
  const e = tab[tab.length - 1]; return createPet(e.sp, rint(e.min, e.max));
}

// 7d. BIGGER MAPS: every outdoor map is stretched to 1.5 times its written size, once, at startup.
// The maps above are written at their original size. Here every second row and column (spread evenly) is doubled,
// and every position in the map data (exits, doors, people, chests, labels, tasks) is moved to match.
// Rows and columns that run through a building, an exit, or a gatekeeper's post are never doubled, so doors stay
// single, openings keep their width and nobody can slip past a gatekeeper. The lab (an indoor map) keeps its size.
// Code outside the map data that names a written position must convert it with gx(map, x) and gy(map, y).
// ---------------------------------------------------------------------

    if (best < 0) break;

    m.rows.forEach((r, y) => { for (let x = 0; x < w; x++) if ('RBKHWD'.includes(r[x])) { bx[x] = true; by[y] = true; } });
    for (const e of m.exits) {
      if (e.y === 0 || e.y + e.h >= h) for (let i = 0; i < e.w; i++) bx[e.x + i] = true;

    }
    for (const n of m.npcs) if (n.moveTo) { bx[n.x] = by[n.y] = bx[n.moveTo.x] = by[n.moveTo.y] = true; }

function drawCage(tx, ty, X, Y) {

  const sp = CAGE_PETS[(tx * 7 + ty * 3) % CAGE_PETS.length];
  const bob = Math.floor((frame + tx * 13) / 40) % 2;

const GROUND_ONLY = { '.': 1, 'f': 1, '=': 1, '_': 1, '*': 1, 'm': 1, 'w': 1, 'b': 1, 'L': 1, 'P': 1, 'T': 1, 'J': 1, 'Y': 1, 'R': 1, 'B': 1, 'K': 1, 'H': 1, 'W': 1, 'D': 1, 'r': 1, 'q': 1, 'c': 1, '|': 1, 'M': 1 };   // fully painted into the ground picture
function drawWorld() {
  const m = world.map;
  const cx = Math.round(world.camX), cy = Math.round(world.camY);
  ctx.fillStyle = m.bg || (m.lab ? '#14121e' : '#1e5a2a'); ctx.fillRect(0, 0, W, H);
  const x0 = Math.floor(cx / TS), y0 = Math.floor(cy / TS);
  const wf = Math.floor(frame / 30) % 2;
  drawGround(m, cx, cy);   // the pre-painted ground; then only the tiles that move or stand up are drawn each frame
  for (let ty = y0; ty <= y0 + Math.ceil(H / TS); ty++) {
    for (let tx = x0; tx <= x0 + Math.ceil(W / TS); tx++) {
      if (ty < 0 || tx < 0 || ty >= m.rows.length || tx >= m.rows[0].length) continue;
      const ch = m.rows[ty][tx], X = tx * TS - cx, Y = ty * TS - cy;
      if (ch === 'C') drawCage(tx, ty, X, Y);
      else if (ch === '~') drawSparkles(tx, ty, X, Y);
      else if (ch === 'f') ctx.drawImage(flowerBed((tx * 5 + ty * 3) % 4)[Math.floor((frame + tx * 11 + ty * 7) / 34) % 2], X, Y);
      else if (TALL_KIND[ch]) ctx.drawImage(tallBlades(tallKindAt(m, ch), Math.floor(hash2(tx, ty, 61) * 5))[[0, 1, 0, 2][(Math.floor(frame / 24) + tx * 3 + ty * 5) % 4]], X - TALL_OX, Y - TALL_OY);
      else if (!GROUND_ONLY[ch]) { const frames = TILES[ch] || TILES['.']; ctx.drawImage(frames[frames.length > 1 ? wf : 0], X, Y); }
    }
  }
  // Things that stand on the map, back to front.
  const things = [];
  for (const c of m.chests) things.push({ y: c.y, draw: () => {
    const open = chestIsOpen(c.id);
    let oy = 0;
    if (world.chestAnim && world.chestAnim.id === c.id) oy = world.chestAnim.t < 10 ? -Math.round(Math.sin(world.chestAnim.t / 10 * Math.PI) * 3) : 0;
    ctx.drawImage(open ? SPR_CHEST_O : SPR_CHEST_C, c.x * TS - cx, c.y * TS - cy + oy);

      for (let k = 0; k < 5; k++) {
        const ang = k * 1.256 + t * 0.05, r = 4 + t * 0.35;
        ctx.fillRect(Math.round(c.x * TS - cx + 8 + Math.cos(ang) * r), Math.round(c.y * TS - cy + 4 - t * 0.2 + Math.sin(ang) * r * 0.5), 2, 2);
      }
    }
  } });
  for (const n of m.npcs) { const q = npcPos(n); things.push({ y: q.y, cx: q.x * TS - cx, cy: q.y * TS - cy, draw: () => {
    const d = world.npcDir[n.id] || q.dir;
    if (n.boss) { drawShadow(q.x * TS - cx + 8, q.y * TS - cy + 14, 24, 7); ctx.drawImage(PET_SPR[n.boss], q.x * TS - cx - 8, q.y * TS - cy - 17 + (Math.floor(frame / 32) % 2)); }   // a boss is a pet twice the usual size
    else drawChar(n.look, d, idleFrame(q.x * 3 + q.y), q.x * TS - cx, q.y * TS - cy);
    if (n.trainer && !G.flags[n.id] && Math.floor(frame / 30) % 2 === 0) drawText('!', q.x * TS - cx + 6, q.y * TS - cy - 21, COL.red, 1, COL.paper);
    const task = QUEST_BY_GIVER[n.id];
    if (task && (questState(task) === 'new' || questReady(task))) drawText(questReady(task) ? '!' : '?', q.x * TS - cx + 6, q.y * TS - cy - 21 - (Math.floor(frame / 20) % 2), questReady(task) ? '#3cc85a' : '#ffd84a', 1, COL.border);
  } }); }
  for (const q of QUESTS) if (q.kind !== 'show' && MAPS[q.map] === m && questState(q) === 'active') things.push({ y: q.y, draw: () => {
    const X = q.x * TS - cx, Y = q.y * TS - cy, bob = Math.floor(frame / 15) % 2;
    if (q.kind === 'pet') { drawShadow(X + 8, Y + 14, 12, 5); ctx.drawImage(PET16[q.pet], X, Y - 2 + bob); drawText('?', X + 6, Y - 12, '#ffd84a', 1, COL.border); }

  } });
  for (const p of PUZZLES) if (MAPS[p.map] === m) for (const o of p.objs) things.push({ y: o.y, draw: () => drawPuzzleObj(p, o, o.x * TS - cx, o.y * TS - cy) });
  if (m.lab && !G.flags.gizmo && !puzDone('code')) { const gz = m.npcs.find(n => n.id === 'gizmo'); if (gz) things.push({ y: gz.y + 0.2, draw: () => {   // Dr. Gizmo's force field
    ctx.fillStyle = PALETTE[PI.water[0]];

  } }); }
  const pp = playerPixel();
  const pf = world.moving && world.mt < 0.55 ? 1 : 0;
  things.push({ y: pp.y / TS + 0.01, cx: Math.round(pp.x) - cx, cy: Math.round(pp.y) - cy, draw: () => {
    const hop = emoteHop(world.emote);

    drawEmote(world.emote, Math.round(pp.x) - cx + 8, Math.round(pp.y) - cy - 10 + hop);
    const under = tileAt(m, G.x, G.y);
    if (!world.moving && TALL_KIND[under]) {   // standing in tall grass: the front blades cover your feet
      ctx.drawImage(tallBlades(tallKindAt(m, under), Math.floor(hash2(G.x, G.y, 61) * 5))[0], 0, TALL_OY + 9, TALL_W, 7, G.x * TS - cx - TALL_OX, G.y * TS - cy + 9, TALL_W, 7);
    }
  } });
  // Tall things: one strip of trees per map row, and the buildings. They sort in between the characters.
  const tall = worldObjects(m);
  for (let ty = Math.max(0, y0); ty <= Math.min(m.rows.length - 1, y0 + Math.ceil(H / TS) + 2); ty++) {
    const strip = tall.strips[ty];
    if (strip) things.push({ y: ty - 0.4, draw: () => {
      const sx = Math.max(0, cx), ex = Math.min(strip.width, cx + W);

    } });
  }
  for (const b of tall.buildings) things.push({ y: b.y + b.h - 1.4, draw: () => ctx.drawImage(b.canvas, b.x * TS - B_OX - cx, b.y * TS - B_OY - cy) });
  // A character standing just behind a tree top or a roof edge: its legs are hidden, but its head and body stay in view.
  for (const t of things.slice()) if (t.cx !== undefined) things.push({ y: t.y + 1, draw: () => { ctx.save(); ctx.beginPath(); ctx.rect(t.cx - 8, t.cy - 24, 32, 32); ctx.clip(); t.draw(); ctx.restore(); } });
  things.sort((a, b) => a.y - b.y).forEach(t => t.draw());
  drawMood(m, cx, cy);   // light, shade and weather
  for (const e of m.exits) drawExitArrow(e, cx, cy);   // a bouncing arrow marks every way out
  for (const l of m.labels) {

    ctx.fillStyle = 'rgba(21,67,86,0.35)'; ctx.fillRect(lx + 1, ly + 12, w, 1);                       // a signboard: wooden frame, cream face, soft shadow
    ctx.fillStyle = PALETTE[PI.wood[3]]; ctx.fillRect(lx, ly, w, 12);
    ctx.fillStyle = PALETTE[PI.wood[1]]; ctx.fillRect(lx, ly, w, 1); ctx.fillRect(lx, ly, 1, 11);
    ctx.fillStyle = COL.paper; ctx.fillRect(lx + 1, ly + 1, w - 2, 10);
    ctx.fillStyle = PALETTE[PI.cream[1]]; ctx.fillRect(lx + 1, ly + 10, w - 2, 1);
    drawText(l.text, lx + 4, ly + 2, COL.ink);
  }
  if (world.banner > 0) {
    const a = Math.min(1, world.banner / 30);
    ctx.save(); ctx.globalAlpha = a;
    const w = textW(m.name) + 16;
    box(6, 6, w, 18);
    drawText(m.name, 14, 11, COL.ink);

function foeName(B, p) { return B.wild ? 'The wild ' + petName(p) : B.o.trainer.boss ? petName(p) : B.o.trainer.name + '\'s ' + petName(p); }
async function chooseAction(B) {
  for (;;) {
    const a = await actionMenu(B);
    if (a === 0) { const m = await moveMenu(B); if (m < 0) continue; return { kind: 'move', move: B.player.moves[m] }; }
    if (a === 1) {
      const r = await bagMenu(true, B);
      if (!r) continue;
      if (r.treat) return { kind: 'treat', key: r.treat };
      if (r.rod) return { kind: 'rod' };
      return { kind: 'item' };
    }
    if (a === 2) {
      const i = await choosePet({ title: 'Switch to which pet?' });
      if (i < 0) continue;
      const p = G.party[i];
      if (p === B.player) { await say(petName(p) + ' is already battling!'); continue; }
      if (isTired(p)) { await say(petName(p) + ' is too tired to battle. Heal it first!'); continue; }
      return { kind: 'switch', pet: p };
    }
    return { kind: 'run' };
  }
}
async function attack(B, isPlayer, moveId) {
  const att = isPlayer ? B.player : B.enemy, def = isPlayer ? B.enemy : B.player;
  const mv = MOVES[moveId];
  await bsay((isPlayer ? petName(att) : foeName(B, att)) + ' used ' + mv.name + '!');
  if (isPlayer) B.lungeP = 10; else B.lungeE = 10;
  await wait(10);
  const r = calcDamage(att, def, moveId), mult = r.mult;
  const dmg = isPlayer ? r.dmg : Math.max(1, Math.floor(r.dmg * ENEMY_DAMAGE));
  def.hp = Math.max(0, def.hp - dmg);
  sfx(mult > 1 ? 'superHit' : mult < 1 ? 'weakHit' : 'hit');
  if (isPlayer) B.hitE = 24; else B.hitP = 24;
  battleImpact(B, isPlayer ? 'E' : 'P', mult);
  await settleHP(B);
  await wait(8);
  if (mult > 1) await bsay('It\'s super effective!');
  else if (mult < 1) await bsay('It\'s not very effective...');
}

async function onEnemyKO(B) {

  await bsay(foeName(B, e) + ' is tired out!');
  const xp = xpReward(e.lv, !B.wild);
  let benchedGot = 0;
  for (const p of G.party) {
    if (isTired(p) || p.lv >= MAX_LV) continue;
    const full = B.part.has(p);
    const amt = full ? xp : Math.floor(xp / 2);
    const ev = gainXP(p, amt);
    if (full) await bsay(petName(p) + ' got ' + amt + ' XP!'); else benchedGot = amt;
    for (const x of ev) {
      if (x.t === 'level') { sfx('levelUp'); if (p === B.player) B.dispP = p.hp; await bsay(petName(p) + ' grew to Lv ' + x.lv + '!'); }
      else if (x.t === 'learn') { sfx('confirm'); await bsay(petName(p) + ' learned ' + MOVES[x.move].name + '!'); }
    }
  }
  if (benchedGot) await bsay('Your other pets got ' + benchedGot + ' XP too.');
  const coins = 10 * e.lv;
  G.coins += coins; sfx('coin');
  await bsay('You got ' + coins + ' coins!');
  if (!B.wild && B.idx < B.o.enemies.length - 1) {
    B.idx++;
    B.setEnemy(B.o.enemies[B.idx]);
    B.part = new Set([B.player]);
    await wait(20);
    await bsay(B.o.trainer.name + ' sends out ' + petName(B.enemy) + '!');
    return null;
  }
  G.stats.wins++;
  playMusic('victory', { cut: true });
  if (!isTired(B.player)) B.emote = { t: 0, kind: 'star' };
  if (!B.wild) await bsay('You beat ' + B.o.trainer.name + '!');

}

// Fish are caught with the Fishing Rod (bought once at the Pet Shop, never used up). The more tired the fish, the better the odds.
async function castRod(B) {

  const ok = Math.random() < rodChance(e);

  B.cast = null;

async function battleTurn(B) {
  const act = await chooseAction(B);
  if (act.kind === 'run') {
    sfx('run');
    if (B.wild) await bsay('You got away safely!');
    else if (B.o.trainer.boss) await bsay('You backed away. ' + B.o.trainer.name + ' is still blocking the way.');
    else await bsay('You left the battle. ' + B.o.trainer.name + ' says: "Come back and try again any time!"');
    return 'run';
  }
  if (act.kind === 'switch') {
    sfx('switch');
    await bsay('Come back, ' + petName(B.player) + '!');
    B.showPlayer = false; await wait(10);
    B.setPlayer(act.pet);
    await bsay('Go, ' + petName(act.pet) + '!');
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  if (act.kind === 'item') { B.dispP = B.player.hp; const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null; }
  if (act.kind === 'rod') {
    if (await castRod(B)) return 'caught';
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  if (act.kind === 'treat') {
    if (await throwTreat(B, act.key)) return 'caught';
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  // Fight: faster pet goes first (ties: player first).
  const playerFirst = petStats(B.player).spd >= petStats(B.enemy).spd;
  if (playerFirst) {
    await attack(B, true, act.move);
    if (isTired(B.enemy)) return onEnemyKO(B);
    const r = await enemyTurn(B); return r === 'lose' ? 'lose' : null;
  }
  const r = await enemyTurn(B);
  if (r === 'lose') return 'lose';
  if (r === 'switched') return null;
  await attack(B, true, act.move);
  if (isTired(B.enemy)) return onEnemyKO(B);
  return null;
}
async function startBattle(o) {
  G.stats.battles++;

  for (let k = 0; k < 3; k++) { await fadeTo(0.85, 4, '#fff'); await fadeTo(0, 4, '#fff'); }
  await fadeTo(1, 10);

  await wait(22);

  else if (o.trainer.boss) await bsay('Boss ' + o.trainer.name + ' wants to battle!');
  else { await bsay(o.trainer.name + ' wants to battle!'); await bsay(o.trainer.name + ' sends out ' + petName(B.enemy) + '!'); }
  if (noBandages(o.trainer)) await bsay('This is a big battle: no Bandages allowed!');

async function blackout() {

}
async function afterBattle() {

async function learnPrompt(p, m) {
  const name = petName(p), mv = MOVES[m].name;

  await say(name + ' wants to learn ' + mv + '! But a pet can only know 4 moves.');

    const i = await choose(opts, { prompt: 'Pick a move for ' + name + ' to forget, so it can learn ' + mv + ' (' + MOVES[m].type + ', Pow ' + MOVES[m].power + ').', cancel: 4 });
    if (i === 4) {
      if (await yesNo('Skip learning ' + mv + '?')) { await say(name + ' did not learn ' + mv + '.'); return; }

// Evolution: rays of light turn behind the pet, it glows and flickers between its two shapes as a white silhouette,
// then the new form is revealed in a burst of stars.
class EvolveScreen {
  constructor(from, to) { this.from = from; this.to = to; this.t = 0; this._done = false; this.opaque = true; this.fx = []; this.flash = 0; }
  get done() { return this._done; }
  set done(v) { if (v && !this._done) { this.flash = 14; fxSpawn(this, W / 2, 96, 40, { cols: ['#ffffff', '#fff29a', '#ffd94a', '#97e9f3', '#f0689a'], kind: 'star', speed: 4, life: 40, g: 0.03 }); } this._done = v; }
  update() { this.t++; if (this.flash > 0) this.flash--; fxUpdate(this); if (this._done && this.t % 9 === 0) fxSpawn(this, W / 2, 96, 2, { cols: ['#ffffff', '#fff29a'], kind: 'star', speed: 1.6, life: 26, g: -0.01, spread: 70 }); }
  draw() {
    ctx.drawImage(evolveRays(Math.floor(this.t / 7) % 3), 0, 0);
    const pulse = 0.5 + Math.sin(this.t / 6) * 0.25;
    ctx.globalAlpha = this._done ? 0.9 : pulse; ctx.drawImage(GLOW, W / 2 - 64, 96 - 64, 128, 128); ctx.globalAlpha = 1;
    const x = W / 2 - 32, y = 58;
    if (this._done) drawPetSprite(this.to, x, y, 2);
    else {
      const period = Math.max(3, 30 - Math.floor(this.t / 6));
      const showNew = Math.floor(this.t / period) % 2 === 1;
      drawPetSprite(showNew ? this.to : this.from, x, y, 2, this.t > 20 ? { silhouette: '#ffffff', still: true } : { still: true });
    }
    fxDraw(this);
    if (this.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (this.flash / 14 * 0.85).toFixed(2) + ')'; ctx.fillRect(0, 0, W, H - 10); }
  }
  hint() { return ''; }
}
async function evolveScene(p, to = SPECIES[p.sp].evo, intro = 'Oh? ' + petName(p) + ' is starting to grow!') {
  const from = p.sp;
  await say(intro);
  await fadeTo(1, 12, '#fff');

// ---------------------------------------------------------------------
// 18. MAIN LOOP
// ---------------------------------------------------------------------
const STEP_MS = 1000 / 60;
let lastT = 0, acc = 0;
function update() {
  frame++;
  if (touchUI) touchRepeat();
  for (let i = timers.length - 1; i >= 0; i--) {
    if (--timers[i].n <= 0) { const t = timers[i]; timers.splice(i, 1); t.r(); }
  }
  updateFade();
  tickEmotes();
  const inp = inputQueue; inputQueue = [];
  const t = topScreen();
  if (t && t.update) t.update(fade.a >= 1 && fade.target >= 1 ? [] : inp);
  if (G && stack.length && !(stack[0] instanceof TitleScreen)) G.stats.time += 1 / 60;
}
function drawHintBar() {
  let s = '';
  for (let i = stack.length - 1; i >= 0; i--) { const h = stack[i].hint ? stack[i].hint() : ''; if (h) { s = h; break; } }
  if (stack[stack.length - 1] === overworld && busy) s = soundHint();
  ctx.fillStyle = COL.bar; ctx.fillRect(0, HINT_Y, W, H - HINT_Y);
  drawText(touchUI ? touchHint(s) : s, 4, HINT_Y + 1, COL.barText);
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  let start = 0;
  for (let i = stack.length - 1; i >= 0; i--) if (stack[i].opaque) { start = i; break; }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let i = start; i < stack.length; i++) stack[i].draw();
  if (fade.a > 0) { ctx.globalAlpha = fade.a; ctx.fillStyle = fade.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHintBar();
}
function loop(now) {
  if (!lastT) lastT = now;
  acc += Math.min(250, now - lastT); lastT = now;
  let n = 0;
  while (acc >= STEP_MS) {
    try { update(); } catch (e) { console.error(e); recoverFromError(); }
    acc -= STEP_MS;
    if (++n > 5) { acc = 0; break; }
  }
  try { render(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}

// Every scheduled note of every song for 2 complete loops: [step, voice, pitch in Hz (or drum letter), length in steps, accent, effects].
function songEventDump() {
  const out = { sting: activeTheme().sting.slice(), theme: activeTheme().theme.slice(), songs: {} };
  for (const name of logicalSongs()) {   // each song as the active theme plays it
    const song = compileSong(themeSong(name)), pl = { song, formIdx: 0, step: 0, done: false }, ev = [];
    const total = song.form.reduce((n, k) => n + song.parts[k].len, 0) * 2;
    for (let i = 0; i < total && !pl.done; i++) {
      const part = song.parts[song.form[pl.formIdx]];
      for (const layer of part.layers) {
        const e = layer.ev[(pl.step + (layer.off || 0)) % layer.ev.length];
        if (e) ev.push([i, layer.voice, e.drum || e.chirp || +e.f.toFixed(3), e.dur, e.acc ? 1 : 0,
          (e.hold ? 'h' : '') + (e.quarter ? 'q' : '') + (e.bend ? 'b' : '') + (e.vib ? 'v' : '') + (e.arp ? 'a' + e.arp.join('.') : '') + (layer.duty ? 'd' + layer.duty : '') +
          (e.snap ? 's' : '') + (e.wob ? 'w' : '') + (layer.trem ? 't' : '')]);
      }
      advancePlayer(pl);
    }
    out.songs[name] = { bpm: song.bpm, stepSeconds: +song.sd.toFixed(6), echo: song.echo, oneShot: song.oneShot, form: song.form.join(' '),
      partSteps: song.form.map(k => song.parts[k].len), events: ev };
  }
  return out;
}

      ok('...and an unlucky roll gives nothing (the chance is 67%)', nothing && treats() === t1 && CHEST_TREAT_CHANCE === 0.67);
      ok('The Pet Shop sells no treats; a Bandage costs 150 and a Big Bandage 500', SHOP_ORDER.length === 3 && !SHOP_ORDER.some(k => ITEMS[k].treat) && ITEMS.bandage.price === 150 && ITEMS.big.price === 500); }
    // Evolution + learning after level-up
    G.party = [createPet('cookie', 9)]; G.party[0].xp = toNext(9) - 1;
    runScript(() => startBattle({ wild: true, enemies: [createPet('buddy', 2)] }));
    ok('Battle finished and Cookie evolved into Cream', await mash(idle, 1500) && G.party[0].sp === 'cream');
    // Beat the Champion: she reveals Dr. Gizmo and steps aside from the lab path.
    G.party = ['rocky', 'shadow', 'nugget', 'cream', 'spike', 'mango'].map(sp => createPet(sp, 30));   // an end-game team
    G.party.forEach(q => q.moves.sort((x, y) => MOVES[y].power - MOVES[x].power));   // mashing Enter uses the first move, so put the strongest first, like a real player would pick
    ok('The lab path is blocked before the Champion is beaten', !isWalkable(MAPS.peak, gx('peak', 19), gy('peak', 1)));
    enterMap('peak', gx('peak', 19), gy('peak', 2), 'up');
    runScript(() => talkTo(champ));
    ok('Champion battle won and she steps aside', await mash(idle, 2000) && G.flags.maple === true && npcPos(champ).x === gx('peak', 17) && !G.flags.gizmo);
    ok('No win screen yet (the story continues)', !stack.some(s => s instanceof WinScreen));
    window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyW' })); await wait(40);
    window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyW' })); await wait(40);
    ok('Walking north enters Gizmo\'s Lab', await mash(idle, 10) && G.map === 'lab');
    const bolt = MAPS.lab.npcs.find(n => n.id === 'bolt'), gizmo = MAPS.lab.npcs.find(n => n.id === 'gizmo');
    ok('Lab Helper Bolt blocks the door', !isWalkable(MAPS.lab, gx('lab', 11), gy('lab', 10)));
    enterMap('lab', gx('lab', 11), gy('lab', 11), 'up');
    runScript(() => talkTo(bolt));
    ok('Beat Bolt and he steps aside', await mash(idle, 2000) && G.flags.bolt === true && isWalkable(MAPS.lab, gx('lab', 11), gy('lab', 10)));
    enterMap('lab', gx('lab', 11), gy('lab', 4), 'up');
    { G.puz = {};   // Dr. Gizmo's code lock: he cannot be battled until the panel takes 4, 6, 2
      runScript(() => talkTo(gizmo)); await wait(6);
      const fieldMsg = topScreen() instanceof MessageScreen && topScreen().pages.flat().join(' ').includes('force field');
      await mash(idle, 30);
      const panel = PUZZLES.find(p => p.id === 'code'), tryCode = async keys => { runScript(() => usePuzzle(panel, panel.objs[0])); for (const n of keys) { for (let i = 0; i < 40 && !(topScreen() instanceof ChoiceScreen); i++) await wait(2); await wait(3); for (let i = 0; i < n; i++) await key('ArrowDown'); await key('Enter'); await wait(4); } await mash(idle, 40); };
      await tryCode([0, 0, 0]);
      const stillLocked = !puzDone('code');
      await tryCode([1, 2, 0]);
      ok('Dr. Gizmo hides behind a force field until his code (4, 6, 2) is entered', fieldMsg && stillLocked && puzDone('code') && !G.flags.gizmo); }
    runScript(() => talkTo(gizmo));
    let sawWin = false;
    for (let i = 0; i < 3000 && !(sawWin && idle()); i++) { if (topScreen() instanceof WinScreen) sawWin = true; await key('Enter'); await wait(6); }
    ok('Beating Dr. Gizmo frees the pets and shows the win screen', sawWin && G.flags.gizmo === true);
    ok('A grateful Kiwi joins the team', G.party.some(q => q.sp === 'kiwi' || q.sp === 'mango'));
    ok('After the win screen you can keep exploring', idle() && G.map === 'lab');
    ok('Never ended with an error and the screen stack is clean', stack.length === 1);
  } catch (err) { ok('No exceptions: ' + err, false); }
  const text = (fails ? 'SMOKE FAIL (' + fails + ')' : 'SMOKE PASS (' + log.length + ' checks)') + '\n' + log.join('\n');
  console.log(text);
  document.getElementById('testout').textContent = text;
}

// ---------------------------------------------------------------------
// 21. BOOT
// ---------------------------------------------------------------------
function boot() {
  loadSoundStyle();
  buildAllSprites();
  if (TEST_MODE) runSelfTest();
  else if (MUSIC_MODE) push(new MusicRoomScreen());
  else if (VIEW) devView(VIEW);
  else push(new SplashScreen());
  if (VIEW === 'smoke') {   // headless browsers barely run animation frames: step the game with a timer instead
    const tick = () => { try { update(); } catch (e) { console.error(e); } setTimeout(tick, 2); };
    tick();
    return;
  }
  requestAnimationFrame(loop);
}
boot();
</script>
